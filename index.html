function importarSimbolos(){
  if(soloLectura()) return;
  const sel = detSimb.filter(h => h.importar);
  if(!sel.length){ alert('No hay filas marcadas.'); return; }
  const pid = state.proyectoActivo;
  let n = 0, skip = 0;
  const calByPage = {};
  sel.forEach(h => {
    const t = getTipo(h.tipoId); if(!t) return;
    /* si ya existe un elemento con ese código (p. ej. de la tabla), solo le completamos la posición */
    const porCod = h.codigo && state.elementos.find(e => e.proyectoId === pid && !e.borrado && e.tipoId === h.tipoId && (e.codigo || '').toUpperCase() === h.codigo.toUpperCase());
    const vRef = viaRefDe(t);
    if(porCod){
      let cambio = false;
      if(!porCod.plano || porCod.plano.x == null){ porCod.plano = {page:h.page, x:h.planoX, y:h.planoY}; cambio = true; }
      if(vRef && h.via && !porCod.valores[vRef]){ porCod.valores[vRef] = h.via; cambio = true; }
      if(cambio){ porCod.modificado = Date.now(); n++; } else skip++;
      return;
    }
    if(state.elementos.some(e => e.proyectoId === pid && !e.borrado && e.tipoId === h.tipoId && e.plano && e.plano.page === h.page
        && Math.hypot(e.plano.x - h.planoX, e.plano.y - h.planoY) < 9)){ skip++; return; }
    const val = Object.assign({}, h.firma.valores);
    const ref = pkRefDe(t);
    if(ref){
      if(!(h.page in calByPage)) calByPage[h.page] = calibrar(h.page);
      const cal = calByPage[h.page];
      if(cal) val[ref] = toPkStr(cal.inv(h.planoX));
      else if(h.pk) val[ref] = h.pk;
    }
    if(vRef && h.via) val[vRef] = h.via;
    state.elementos.push({id:uid(), proyectoId:pid, tipoId:h.tipoId, codigo:h.codigo || '', valores:val, hist:[],
      plano:{page:h.page, x:h.planoX, y:h.planoY}, creado:Date.now(), modificado:Date.now()});
    n++;
  });
  if(n) registrarCambio('importación', 'creados/actualizados ' + n + ' elemento(s) por detección de símbolos');
  save(); detSimb = null;
  alert('Creados ' + n + ' elemento(s).' + (skip ? '\nSaltados ' + skip + ' ya existentes.' : ''));
  render();
}

function esquemaCanvas(conPk, sinPk, elsAll){
  const lugares = proyActivo().lugares || [];
  const lugarSel = esqLugar ? lugares.find(l => l.id === esqLugar) : null;
  /* con un lugar seleccionado se muestran sus vías + las GENERALES */
  const viasDef = (proyActivo().vias || []).filter(v => !lugarSel || !v.lugar || v.lugar === 'general' || v.lugar === esqLugar);
  /* el ancho/extensión del esquema y los carriles NO dependen de los filtros de elementos */
  const paraExtent = (elsAll && elsAll.length) ? elsAll.map(e => ({p:elemPK(e), via:viaDe(e)})) : conPk.concat(sinPk);
  let mn, mx;
  if(lugarSel){ mn = lugarSel.pkIni; mx = lugarSel.pkFin; }
  else {
    const pks = [];
    paraExtent.forEach(d => [d.p.ini, d.p.fin, d.p.pu].forEach(v => { if(!isNaN(v)) pks.push(v); }));
    viasDef.forEach(v => { pks.push(v.pkIni, v.pkFin); });
    if(!pks.length){ pks.push(0, 1); }
    mn = Math.min(...pks); mx = Math.max(...pks);
  }
  if(mn === mx) mx = mn + 0.4;
  const pad = (mx - mn) * 0.06 + 0.03; mn -= pad; mx += pad;

  const esMain = v => !v || v === '—' || /^1(\D|$)/.test(String(v).trim());
  const esPar = v => /^\d+$/.test(String(v).trim()) && (+v % 2 === 0);
  const laneSet = [];
  paraExtent.forEach(d => { const v = d.via || ''; if(v && !esMain(v) && laneSet.indexOf(v) < 0) laneSet.push(v); });
  viasDef.forEach(v => { if(!esMain(v.num) && laneSet.indexOf(String(v.num)) < 0) laneSet.push(String(v.num)); });
  const numSort = (a, b) => String(a).localeCompare(String(b), 'es', {numeric:true});
  const secs = laneSet.slice().sort(numSort);
  const secsArriba = secs.filter(v => !esPar(v)).sort(numSort);   /* impares: hacia arriba */
  const secsAbajo = secs.filter(v => esPar(v)).sort(numSort);     /* pares: hacia abajo */

  const mL = 84, mR = 30, topP = 30;
  const fit = Math.max(30, (1120 - mL - mR) / (mx - mn));
  esqFit = fit;
  const pxKm = Math.max(20, Math.min(9000, esqZoom || fit));
  const W = Math.round(mL + mR + (mx - mn) * pxKm);
  const X = pk => mL + (pk - mn) * pxKm;
  const gap = 52;
  const baseY = topP + 24 + secsArriba.length * gap;
  const H = baseY + Math.max(66, 30 + secsAbajo.length * gap + 40);
  const yFor = v => {
    if(esMain(v)) return baseY;
    const s = String(v).trim();
    return esPar(s) ? baseY + (secsAbajo.indexOf(s) + 1) * gap : baseY - (secsArriba.indexOf(s) + 1) * gap;
  };
  const lanesY = [{via:'', y:baseY}].concat(secs.map(v => ({via:v, y:yFor(v)})));
  esqCtx = {mn, mx, pxKm, mL, baseY, lanesY};

  const vis = conPk;   /* ya viene filtrado por pasaFiltros desde viewEsquema */
  const esLineal = d => !isNaN(d.p.ini) && !isNaN(d.p.fin);
  const tri = (x, y) => '<path d="M' + (x - 4) + ' ' + (y - 6) + ' L' + (x + 4) + ' ' + (y - 6) + ' L' + x + ' ' + (y + 1) + ' Z" fill="#8794a1"/>';
  const ttl = e => { const h = hoverEsq(e); return h ? '<title>' + esc(h) + '</title>' : ''; };

  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
  /* rejilla de PK: paso adaptativo al zoom (mínimo 25 m) */
  const stepsKm = [0.025, 0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 5, 10, 20, 50];
  const step = stepsKm.find(st => st * pxKm >= 66) || 100;
  const dec = step < 0.1 ? 3 : (step < 1 ? 2 : (step < 10 ? 1 : 0));
  for(let p = Math.ceil(mn / step) * step; p <= mx; p += step){
    const x = X(p);
    s += '<line x1="' + x.toFixed(1) + '" y1="' + (topP - 10) + '" x2="' + x.toFixed(1) + '" y2="' + (H - 26) + '" stroke="#161f29" stroke-width="1"/>';
    s += '<text x="' + x.toFixed(1) + '" y="' + (H - 10) + '" fill="#6a7d8c" font-size="10" text-anchor="middle">' + p.toFixed(dec).replace('.', ',') + '</text>';
  }
  /* zonas de clic por vía */
  s += '<rect data-via="" x="' + mL + '" y="' + (baseY - 22) + '" width="' + (W - mR - mL) + '" height="44" fill="transparent"/>';
  secs.forEach(v => { const y = yFor(v); s += '<rect data-via="' + esc(v) + '" x="' + mL + '" y="' + (y - 20) + '" width="' + (W - mR - mL) + '" height="40" fill="transparent"/>'; });
  /* línea general */
  s += '<line x1="' + mL + '" y1="' + baseY + '" x2="' + (W - mR) + '" y2="' + baseY + '" stroke="#5a6b7a" stroke-width="2.5"/>';
  s += '<text x="8" y="' + (baseY + 4) + '" fill="#9db0c0" font-size="11">Vía 1</text>';
  s += '<text x="8" y="' + (baseY + 16) + '" fill="#6a7d8c" font-size="9">general</text>';

  const tope = (x, y) => '<line x1="' + x.toFixed(1) + '" y1="' + (y - 5) + '" x2="' + x.toFixed(1) + '" y2="' + (y + 5) + '" stroke="#8794a1" stroke-width="3"/>';
  const peine = (v, a, b, parY, topera, ladoCon) => {
    a = Math.max(a, mn); b = Math.min(b, mx); if(b <= a) return;
    const y = yFor(v), xa = X(a), xb = X(b), ramp = Math.max(10, Math.min(34, (xb - xa) / 3.6));
    if(topera){
      if(ladoCon === 'fin'){
        s += '<path d="M' + (xa).toFixed(1) + ' ' + y + ' L' + xb.toFixed(1) + ' ' + y + ' L' + (xb + ramp).toFixed(1) + ' ' + parY + '" fill="none" stroke="#5a6b7a" stroke-width="2"/>';
        s += tri(xb + ramp, parY) + tope(xa, y);
      } else {
        s += '<path d="M' + (xa - ramp).toFixed(1) + ' ' + parY + ' L' + xa.toFixed(1) + ' ' + y + ' L' + xb.toFixed(1) + ' ' + y + '" fill="none" stroke="#5a6b7a" stroke-width="2"/>';
        s += tri(xa - ramp, parY) + tope(xb, y);
      }
    } else {
      s += '<path d="M' + (xa - ramp).toFixed(1) + ' ' + parY + ' L' + xa.toFixed(1) + ' ' + y + ' L' + xb.toFixed(1) + ' ' + y + ' L' + (xb + ramp).toFixed(1) + ' ' + parY + '" fill="none" stroke="#5a6b7a" stroke-width="2"/>';
      s += tri(xa - ramp, parY) + tri(xb + ramp, parY);
    }
  };
  /* vías dibujadas por el usuario */
  const viasDefNums = new Set(viasDef.map(v => String(v.num)));
  viasDef.forEach(v => { peine(String(v.num), v.pkIni, v.pkFin, esMain(v.padre) ? baseY : yFor(v.padre), v.tipo === 'topera', v.ladoCon || 'ini'); });
  /* auto: zonas de estación para vías referenciadas por elementos y no dibujadas */
  const secEls = vis.filter(d => !esMain(d.via) && !viasDefNums.has(String(d.via).trim()));
  const secPks = [];
  secEls.forEach(d => [d.p.ini, d.p.fin, d.p.pu].forEach(k => { if(!isNaN(k)) secPks.push(k); }));
  secPks.sort((a, b) => a - b);
  const zonas = [];
  secPks.forEach(k => { const z = zonas[zonas.length - 1]; if(z && k - z.max < 1.6) z.max = Math.max(z.max, k); else zonas.push({min:k, max:k}); });
  zonas.forEach(z => {
    const zEls = secEls.filter(d => [d.p.ini, d.p.fin, d.p.pu].some(v => !isNaN(v) && v >= z.min - 0.05 && v <= z.max + 0.05));
    const zViasAll = [...new Set(zEls.map(d => String(d.via).trim()))].sort(numSort);
    /* impares y pares en cascada independiente (cada grupo cuelga de la general) */
    [zViasAll.filter(v => !esPar(v)), zViasAll.filter(v => esPar(v))].forEach(zVias => {
      let firstA = z.min, firstB = z.max, firstY = baseY, fset = false;
      zVias.forEach((v, idx) => {
        const parA = idx === 0 ? z.min : firstA, parB = idx === 0 ? z.max : firstB, parY = idx === 0 ? baseY : firstY;
        const ps = []; zEls.filter(d => String(d.via).trim() === v).forEach(d => [d.p.ini, d.p.fin, d.p.pu].forEach(k => { if(!isNaN(k)) ps.push(k); }));
        let a = Math.min(...ps), b = Math.max(...ps);
        const sp = Math.max((b - a) * 0.16, 0.02); a -= sp; b += sp;
        const inset = (parB - parA) * 0.06 + 0.006 + idx * 0.004;
        a = Math.max(a, parA + inset); b = Math.min(b, parB - inset);
        if(b <= a){ a = parA + inset; b = parB - inset; }
        peine(v, a, b, parY);
        if(!fset){ firstA = a; firstB = b; firstY = yFor(v); fset = true; }
      });
    });
  });
  secs.forEach(v => { s += '<text x="8" y="' + (yFor(v) + 4) + '" fill="#9db0c0" font-size="11">Vía ' + esc(v) + '</text>'; });

  /* cruces bajo vía: línea vertical que atraviesa la vía (pasa de un lado al otro).
     Varios en el mismo PK se separan unos píxeles sin cambiar de PK. */
  const cruces = vis.filter(d => esCruce(d.e));
  const cruceIds = new Set(cruces.map(d => d.e.id));
  const cruceOcc = {};
  cruces.forEach(d => {
    const pk = !isNaN(d.p.pu) ? d.p.pu : (!isNaN(d.p.ini) ? d.p.ini : d.p.fin);
    if(isNaN(pk)) return;
    const y0 = yFor(d.via);
    let x = X(pk);
    const key = Math.round(y0) + '_' + Math.round(x);
    const k = cruceOcc[key] = (cruceOcc[key] || 0) + 1;
    x += (k - 1) * 5;
    const t = getTipo(d.e.tipoId) || {}, col = t.color || '#888';
    const y1 = y0 - 18, y2 = y0 + 18;
    s += '<g data-el="' + d.e.id + '" style="cursor:grab">' + ttl(d.e) +
      '<line x1="' + x.toFixed(1) + '" y1="' + y1 + '" x2="' + x.toFixed(1) + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="2.5"/>' +
      '<line x1="' + (x - 3).toFixed(1) + '" y1="' + y1 + '" x2="' + (x + 3).toFixed(1) + '" y2="' + y1 + '" stroke="' + col + '" stroke-width="2.5"/>' +
      '<line x1="' + (x - 3).toFixed(1) + '" y1="' + y2 + '" x2="' + (x + 3).toFixed(1) + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="2.5"/>' +
      '<text x="' + x.toFixed(1) + '" y="' + (y1 - 4) + '" fill="#8ea1b1" font-size="9" text-anchor="middle">' + esc(d.e.codigo || '') + '</text></g>';
  });
  /* lineales apilados — arriba/abajo de la vía según Lado/ubicación (izq=arriba, der=abajo) */
  const grpL = {};
  vis.filter(d => !cruceIds.has(d.e.id) && esLineal(d)).forEach(d => { const v = esMain(d.via) ? '1' : String(d.via).trim(); (grpL[v] = grpL[v] || []).push(d); });
  Object.keys(grpL).forEach(v => {
    const arr = grpL[v].sort((p, q) => Math.min(p.p.ini, p.p.fin) - Math.min(q.p.ini, q.p.fin));
    const rowsUp = [], rowsDn = [], y0 = yFor(v);
    arr.forEach(d => {
      const a = X(Math.min(d.p.ini, d.p.fin)), b = X(Math.max(d.p.ini, d.p.fin));
      const arriba = ladoVert(d.e) < 0;
      const rows = arriba ? rowsUp : rowsDn;
      let ri = rows.findIndex(r => r < a - 4); if(ri < 0){ ri = rows.length; rows.push(0); } rows[ri] = b;
      const t = getTipo(d.e.tipoId) || {}, col = t.color || '#888';
      const y = arriba ? (y0 - 12 - ri * 8) : (y0 + 11 + ri * 8);
      const ty = arriba ? (y - 5) : (y + 12);
      s += '<g data-el="' + d.e.id + '" style="cursor:grab">' + ttl(d.e) +
        '<line x1="' + a.toFixed(1) + '" y1="' + y + '" x2="' + b.toFixed(1) + '" y2="' + y + '" stroke="' + col + '" stroke-width="3" stroke-linecap="round"/>' +
        '<line x1="' + a.toFixed(1) + '" y1="' + (y - 4) + '" x2="' + a.toFixed(1) + '" y2="' + (y + 4) + '" stroke="' + col + '" stroke-width="1.5"/>' +
        '<line x1="' + b.toFixed(1) + '" y1="' + (y - 4) + '" x2="' + b.toFixed(1) + '" y2="' + (y + 4) + '" stroke="' + col + '" stroke-width="1.5"/>' +
        '<text x="' + ((a + b) / 2).toFixed(1) + '" y="' + ty + '" fill="#8ea1b1" font-size="9" text-anchor="middle">' + esc(d.e.codigo || '') + '</text></g>';
    });
  });
  /* puntuales — arriba/abajo de la vía según Lado/ubicación */
  const occ = {};
  vis.filter(d => !cruceIds.has(d.e.id) && !esLineal(d)).forEach(d => {
    const t = getTipo(d.e.tipoId) || {}, col = t.color || '#888';
    const y0 = yFor(d.via), x = X(d.p.pu), dir = ladoVert(d.e);
    const key = dir + '_' + Math.round(y0) + '_' + Math.round(x / 15);
    const k = occ[key] = (occ[key] || 0) + 1;
    const stack = (k === 1 ? 0 : (k % 2 ? -1 : 1) * Math.ceil((k - 1) / 2) * 12);
    const cy = dir > 0 ? (y0 + 13 + stack) : (dir < 0 ? (y0 - 13 + stack) : (y0 - 11 + stack));
    const esAg = /aguja|desv/i.test(t.nombre || '');
    const ty = dir > 0 ? (cy + 15) : (cy - 9);
    s += '<g data-el="' + d.e.id + '" style="cursor:grab">' + ttl(d.e) +
      (esAg ? tri(x, cy + 6) : '<circle cx="' + x.toFixed(1) + '" cy="' + cy + '" r="5" fill="' + col + '" stroke="#0a0f16" stroke-width="1.5"/>') +
      '<text x="' + x.toFixed(1) + '" y="' + ty + '" fill="#8ea1b1" font-size="9" text-anchor="middle">' + esc(d.e.codigo || '') + '</text></g>';
  });
  s += '</svg>';

  const box = el('div', {class:'esq-wrap'});
  box.innerHTML = s;
  const pkEn = clientX => { const svg = box.querySelector('svg'); const r = svg.getBoundingClientRect(); return esqCtx.mn + (clientX - r.left - esqCtx.mL) / esqCtx.pxKm; };
  const viaEn = clientY => { const svg = box.querySelector('svg'); const r = svg.getBoundingClientRect(); const yy = clientY - r.top;
    let best = esqCtx.lanesY[0], bd = 1e9; esqCtx.lanesY.forEach(l => { const dd = Math.abs(l.y - yy); if(dd < bd){ bd = dd; best = l; } }); return best.via; };

  /* zoom con la rueda, hacia el cursor */
  box.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = box.getBoundingClientRect();
    const cx = ev.clientX - r.left;
    const pkU = esqCtx.mn + (box.scrollLeft + cx - esqCtx.mL) / esqCtx.pxKm;
    esqZoom = Math.max(20, Math.min(9000, (esqZoom || esqFit) * (ev.deltaY < 0 ? 1.2 : 1 / 1.2)));
    esqWheelPend = {pkU, cx};
    reRenderPronto();
  }, {passive:false});
  if(esqWheelPend){
    const wp = esqWheelPend; esqWheelPend = null;
    setTimeout(() => { box.scrollLeft = (mL + (wp.pkU - mn) * pxKm) - wp.cx; if(wp.top != null) box.scrollTop = wp.top; }, 0);
  }

  /* zoom con dos dedos (pellizco) en móvil */
  let pinch = null;
  box.addEventListener('touchstart', ev => {
    if(ev.touches.length === 2){
      const [a, b] = ev.touches;
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), z: esqZoom || esqFit || 100 };
    }
  }, {passive:true});
  box.addEventListener('touchmove', ev => {
    if(pinch && ev.touches.length === 2){
      ev.preventDefault();
      const [a, b] = ev.touches;
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      esqZoom = Math.max(20, Math.min(9000, pinch.z * (d / pinch.d)));
      reRenderPronto();
    }
  }, {passive:false});
  box.addEventListener('touchend', ev => { if(ev.touches.length < 2) pinch = null; }, {passive:true});

  /* dibujar vía a mano */
  box.addEventListener('click', ev => {
    if(esqDibVia){
      const pk = Math.round(pkEn(ev.clientX) * 1000) / 1000;
      if(esqDibP == null){ esqDibP = pk; render(); }
      else { const a = esqDibP; esqDibP = null; nuevaViaModal(null, a, pk); }
      return;
    }
    if(esqArrastre && esqArrastre.moved) return;
    const g = ev.target.closest('[data-el]');
    if(g && !esqArrastre){ nuevoElemento(g.getAttribute('data-el')); return; }
    if(esqAdd.on && esqAdd.tipoId){
      const r = ev.target.closest('[data-via]'); if(!r) return;
      const pk = pkEn(ev.clientX); if(pk < esqCtx.mn || pk > esqCtx.mx) return;
      const via = r.getAttribute('data-via');
      const t = getTipo(esqAdd.tipoId); if(!t) return;
      const pref = {};
      const pkRef = pkRefDe(t); if(pkRef) pref[pkRef] = toPkStr(pk);
      const vr = viaRefDe(t); if(vr && via) pref[vr] = via;
      nuevoElemento(null, {tipoId:esqAdd.tipoId, valores:pref});
    }
  });

  /* arrastrar elementos → cambia PK (y vía) */
  box.addEventListener('contextmenu', ev => ev.preventDefault());
  box.addEventListener('mousedown', ev => {
    if(ev.button === 2){
      ev.preventDefault();
      const sx = ev.clientX, sy = ev.clientY, sl = box.scrollLeft, st = box.scrollTop;
      const mv = e => { box.scrollLeft = sl - (e.clientX - sx); box.scrollTop = st - (e.clientY - sy); };
      const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      return;
    }
    if(ev.button !== 0) return;
    if(esqDibVia || esqAdd.on || fechaVista) return;
    const g = ev.target.closest('[data-el]'); if(!g) return;
    ev.preventDefault();
    esqArrastre = {id:g.getAttribute('data-el'), node:g, x0:ev.clientX, y0:ev.clientY, moved:false};
    const mv = e => {
      if(!esqArrastre) return;
      const dx = e.clientX - esqArrastre.x0, dy = e.clientY - esqArrastre.y0;
      if(Math.abs(dx) + Math.abs(dy) > 3) esqArrastre.moved = true;
      if(esqArrastre.moved) esqArrastre.node.setAttribute('transform', 'translate(' + dx + ',' + dy + ')');
    };
    const up = e => {
      document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
      const ds = esqArrastre;
      if(!ds){ return; }
      if(!ds.moved){ esqArrastre = null; return; }   /* click normal lo maneja el listener de click */
      const el0 = state.elementos.find(x => x.id === ds.id);
      esqArrastre = null;
      if(!el0){ render(); return; }
      const t = getTipo(el0.tipoId);
      let pk = pkEn(e.clientX); pk = Math.max(mn, Math.min(mx, pk));
      const via = viaEn(e.clientY);
      el0.hist = el0.hist || [];
      el0.hist.push({ts:Date.now(), snap:{codigo:el0.codigo, valores:clone(el0.valores), plano:el0.plano ? clone(el0.plano) : null}});
      if(el0.hist.length > 40) el0.hist.shift();
      const p = elemPK(el0);
      if(!isNaN(p.ini) && !isNaN(p.fin)){
        const len = p.fin - p.ini;
        const iniRef = (t.campos.find(r => /inicio|desde/i.test((getCampo(r.campoId) || {}).etiqueta || '')) || {}).campoId;
        const finRef = (t.campos.find(r => /\bfin\b|hasta/i.test((getCampo(r.campoId) || {}).etiqueta || '')) || {}).campoId;
        if(iniRef) el0.valores[iniRef] = toPkStr(pk);
        if(finRef) el0.valores[finRef] = toPkStr(pk + len);
      } else {
        const pkr = pkRefDe(t); if(pkr) el0.valores[pkr] = toPkStr(pk);
      }
      const vr = viaRefDe(t); if(vr) el0.valores[vr] = via;
      el0.modificado = Date.now();
      registrarCambio('edición', (el0.codigo || t.nombre) + ': movido a PK ' + toPkStr(pk) + (via ? ' · vía ' + via : ''), el0.id);
      /* mantener la posición del esquema tras re-renderizar (no volver al PK 0) */
      esqWheelPend = {pkU: esqCtx.mn + (box.scrollLeft - esqCtx.mL) / esqCtx.pxKm, cx: 0, top: box.scrollTop};
      save(); render();
    };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
  return box;
}

/* ================= vista: Modelo de datos ================= */
let selTipoId = null, modeloDrag = null;
function viewModelo(){
  if(!selTipoId && state.elementTypes[0]) selTipoId = state.elementTypes[0].id;
  const p1 = el('div', {class:'card'},
    el('div', {class:'card-h'}, el('span', {class:'t'}, el('span', {class:'dot', style:'background:var(--grn)'}), 'Tipos de campo')),
    el('div', {class:'card-b'},
      el('div', {class:'list'}, PRIMITIVOS.map(p => el('div', {class:'row soft'}, el('span', {class:'grow'}, p.nombre)))),
      el('p', {class:'hint'}, 'Bloques básicos fijos. Las opciones de cada Lista desplegable se editan en la biblioteca.')
    )
  );
  const p2 = el('div', {class:'card'},
    el('div', {class:'card-h'},
      el('span', {class:'t'}, el('span', {class:'dot', style:'background:#8a6cd6'}), 'Biblioteca de campos'),
      el('button', {class:'btn sm', onclick:() => editarCampo(null)}, '+ Campo')
    ),
    el('div', {class:'card-b'},
      el('div', {class:'list'}, state.campos.map(cp =>
        el('div', {class:'row pick', onclick:() => editarCampo(cp.id)},
          el('span', {class:'grow'}, cp.etiqueta),
          el('span', {class:'count'}, primNombre(cp.tipo) + (cp.tipo === 'select' && cp.opciones ? ' · ' + cp.opciones.length : ''))
        ))),
      el('p', {class:'hint'}, 'Define un campo una vez y reúsalo en varios tipos de elemento.')
    )
  );
  const tipo = getTipo(selTipoId);
  const listaTipos = el('div', {class:'list'}, state.elementTypes.map(t =>
    el('div', {class:'row pick' + (t.id === selTipoId ? ' sel' : ''), onclick:() => { selTipoId = t.id; render(); }},
      el('span', {class:'swatch', style:'background:' + (t.color || '#888')}),
      el('span', {class:'grow'}, t.nombre),
      el('span', {class:'count'}, t.campos.length + ' campos · ' + contarPorTipo(t.id))
    )));
  let detalle;
  if(!tipo) detalle = el('div', {class:'empty'}, 'Crea un tipo de elemento para empezar.');
  else{
    const filas = tipo.campos.map((ref, i) => {
      const cp = getCampo(ref.campoId);
      const rt = reglaTexto(ref);
      const row = el('div', {class:'fieldrow', draggable:'true',
        ondragstart:ev => { modeloDrag = i; ev.dataTransfer.effectAllowed = 'move'; },
        ondragend:() => { modeloDrag = null; },
        ondragover:ev => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'move'; row.classList.add('dragover'); },
        ondragleave:() => row.classList.remove('dragover'),
        ondrop:ev => { ev.preventDefault(); row.classList.remove('dragover');
          if(modeloDrag == null || modeloDrag === i) return;
          const [m] = tipo.campos.splice(modeloDrag, 1); tipo.campos.splice(i, 0, m); modeloDrag = null; save(); render(); }},
        el('span', {class:'grip', title:'Arrastra para reordenar'}, '≡'),
        el('span', null, cp ? cp.etiqueta : '(campo borrado)',
          el('span', {style:'display:block;font-size:11px;color:var(--tx3);text-transform:none'}, cp ? primNombre(cp.tipo) : '—'),
          rt ? el('span', {style:'display:block;font-size:11px;color:var(--amber);text-transform:none'}, rt) : null),

const OPS_REGLA = [
  {id:'es', txt:'es igual a'}, {id:'noEs', txt:'no es'}, {id:'unoDe', txt:'es uno de'},

function editarRegla(tipo, idx){
  const ref = tipo.campos[idx];
  const cp = getCampo(ref.campoId) || {etiqueta:'(campo)'};
  const otros = tipo.campos.filter((r, i) => i !== idx && getCampo(r.campoId)).map(r => getCampo(r.campoId));

  const body = el('div', null);
  const CHK = 'width:16px;height:16px;flex:0 0 auto;margin:0';
  function filaCond(cond, i){
    const ctrl = getCampo(cond.campoId) || {};
    const selCampo = el('select', {style:'flex:1 1 150px', onchange:e => { cond.campoId = e.target.value; cond.valor = ''; pinta(); }},
      el('option', {value:''}, '— campo —'),
      ...otros.map(c => el('option', {value:c.id, ...(c.id === cond.campoId ? {selected:'selected'} : {})}, c.etiqueta)));
    const selOp = el('select', {style:'flex:0 1 150px', onchange:e => { cond.op = e.target.value; if(cond.op === 'unoDe' && !Array.isArray(cond.valor)) cond.valor = []; if(cond.op !== 'unoDe' && Array.isArray(cond.valor)) cond.valor = ''; pinta(); }},
      ...OPS_REGLA.map(o => el('option', {value:o.id, ...(o.id === cond.op ? {selected:'selected'} : {})}, o.txt)));
    let valCtl;
    if(cond.op === 'relleno' || cond.op === 'vacio') valCtl = el('span', {style:'color:var(--tx3);font-size:12px'}, '(sin valor)');
    else if(cond.op === 'unoDe'){
      const opts = ctrl.tipo === 'boolean' ? ['Sí', 'No'] : (ctrl.opciones || []);
      const arr = Array.isArray(cond.valor) ? cond.valor : [];
      valCtl = el('div', {style:'display:flex;flex-wrap:wrap;gap:10px'}, ...(opts.length ? opts.map(o =>
        el('label', {style:'display:flex;gap:6px;align-items:center;font-size:12px'},
          el('input', {type:'checkbox', style:CHK, ...(arr.includes(o) ? {checked:'checked'} : {}), onchange:e => {
            if(e.target.checked){ if(!arr.includes(o)) arr.push(o); } else { const k = arr.indexOf(o); if(k >= 0) arr.splice(k, 1); }
            cond.valor = arr;
          }}), o)) : [el('span', {style:'color:var(--tx3);font-size:12px'}, 'Ese campo no tiene opciones de lista')]));
    } else if((ctrl.tipo === 'select' || ctrl.tipo === 'boolean') && (cond.op === 'es' || cond.op === 'noEs')){
      const opts = ctrl.tipo === 'boolean' ? ['Sí', 'No'] : (ctrl.opciones || []);
      valCtl = el('select', {onchange:e => cond.valor = e.target.value},
        el('option', {value:''}, '—'),
        ...opts.map(o => el('option', {value:o, ...(o === cond.valor ? {selected:'selected'} : {})}, o)));
    } else if(cond.op === 'mayor' || cond.op === 'menor'){
      valCtl = el('input', {type:'number', value:cond.valor || '', style:'width:120px', onchange:e => cond.valor = e.target.value});
    } else {
      valCtl = el('input', {value:cond.valor || '', placeholder:'valor', onchange:e => cond.valor = e.target.value});
    }
    return el('div', {style:'border-top:1px solid var(--line);padding:12px 0'},
      el('div', {style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'}, selCampo, selOp),
      el('div', {style:'margin-top:8px'}, valCtl),
      el('div', {style:'text-align:right;margin-top:6px'},
        el('button', {class:'btn sm danger', onclick:() => { conds.splice(i, 1); pinta(); }}, '✕ quitar')));
  }
  function pinta(){
    body.innerHTML = '';
    body.appendChild(el('p', {class:'hint', style:'margin-top:0'}, 'El campo "' + cp.etiqueta + '" aparecerá en la ficha del elemento según esta regla. Si no aplica, se oculta y no se guarda.'));
    body.appendChild(el('div', {class:'field'},
      el('span', {class:'flab'}, '¿Cuándo se muestra?'),
      el('select', {onchange:e => { modo = e.target.value; if(modo === 'si' && !conds.length) conds.push({campoId:'', op:'es', valor:''}); pinta(); }},
        el('option', {value:'siempre', ...(modo === 'siempre' ? {selected:'selected'} : {})}, 'Siempre'),
        el('option', {value:'si', ...(modo === 'si' ? {selected:'selected'} : {})}, 'Solo si se cumplen condiciones…'))));
    if(modo === 'si'){
      if(conds.length > 1) body.appendChild(el('div', {class:'field'},
        el('span', {class:'flab'}, 'Se deben cumplir'),
        el('select', {onchange:e => juntar = e.target.value},

          el('option', {value:'O', ...(juntar === 'O' ? {selected:'selected'} : {})}, 'AL MENOS UNA (ó)'))));

    }

  openModal('Condición de "' + cp.etiqueta + '"', body, () => {
    if(modo === 'siempre' || !conds.length){ delete ref.regla; }
    else {
      const limpias = conds.filter(c => c.campoId && (c.op === 'relleno' || c.op === 'vacio' || (Array.isArray(c.valor) ? c.valor.length : String(c.valor || '').trim() !== '')));

      else ref.regla = {juntar, conds:limpias};
    }
    save(); render();
  }, ref.regla ? () => { delete ref.regla; save(); render(); } : null);
}
function editarCampo(id, tipoParaAnadir){
  const esNuevo = !id;
  const cp = esNuevo ? {id:uid(), etiqueta:'', tipo:'text', opciones:[]} : clone(getCampo(id));
  if(!cp.opciones) cp.opciones = [];
  const inEtq = el('input', {value:cp.etiqueta, placeholder:'Tipo de canalización'});
  const inTipo = el('select', null, ...PRIMITIVOS.map(p => el('option', {value:p.id, ...(p.id === cp.tipo ? {selected:'selected'} : {})}, p.nombre)));
  const inOpc = el('textarea', {rows:5, placeholder:'Una opción por línea'}, cp.opciones.join('\n'));
  const opcWrap = el('div', {class:'field', style:cp.tipo === 'select' ? '' : 'display:none'}, el('span', {class:'flab'}, 'Opciones de la lista'), inOpc);
  inTipo.addEventListener('change', () => { opcWrap.style.display = inTipo.value === 'select' ? '' : 'none'; });
  openModal(esNuevo ? 'Nuevo campo' : 'Editar campo',
    el('div', null,
      el('div', {class:'field'}, el('span', {class:'flab'}, 'Etiqueta'), inEtq),
      el('div', {class:'field'}, el('span', {class:'flab'}, 'Tipo de campo'), inTipo),
      opcWrap
    ),
    () => {
      cp.etiqueta = inEtq.value.trim();
      cp.tipo = inTipo.value;
      cp.opciones = inTipo.value === 'select' ? inOpc.value.split('\n').map(s => s.trim()).filter(Boolean) : [];
      if(!cp.etiqueta){ alert('Pon una etiqueta.'); return false; }
      const ex = state.campos.find(c => c.id === cp.id);
      if(ex) Object.assign(ex, cp); else state.campos.push(cp);
      if(esNuevo && tipoParaAnadir && !tipoParaAnadir.campos.some(r => r.campoId === cp.id))
        tipoParaAnadir.campos.push({campoId:cp.id, obligatorio:false});
      save(); render();
    },
    esNuevo ? null : () => {
      const usos = state.elementTypes.filter(t => t.campos.some(r => r.campoId === id));
      if(usos.length && !confirm('Se usa en ' + usos.length + ' tipo(s). ¿Borrarlo de todos?')) return false;
      state.campos = state.campos.filter(c => c.id !== id);
      state.elementTypes.forEach(t => t.campos = t.campos.filter(r => r.campoId !== id));
      save(); render();
    }
  );
}

/* ================= filtros unificados (BD + Esquema) =================
   filtroVis = conjunto de claves OCULTAS. Vacío = todo visible. Marcar una casilla = verlo. */
let bdSort = {col:'codigo', dir:1};
let filtroVis = new Set();
let addMenu = false;
document.addEventListener('click', () => { if(addMenu){ addMenu = false; render(); } });
function camposFiltroDeTipo(t){
  return (t.campos || [])
    .map(r => getCampo(r.campoId))
    .filter(c => c && (c.tipo === 'select' || c.tipo === 'number') && /tipo|clase|disposic|foco|tubo|cuadr|hilo|carril|calibre|di[aá]metro/i.test(c.etiqueta))
    .slice(0, 2);
}
function valOr(e, cid){ const v = e.valores && e.valores[cid]; return (v != null && String(v).trim() !== '') ? String(v) : '∅'; }
function pasaFiltros(e){
  if(!filtroVis.size) return true;
  if(filtroVis.has('t:' + e.tipoId)) return false;
  if(filtroVis.has('e:' + (valorEstado(e) || '∅'))) return false;
  if(filtroVis.has('l:' + ((lugarDe(e) || {}).id || '∅'))) return false;
  const t = getTipo(e.tipoId); if(!t) return true;
  let key = 'v:' + e.tipoId;
  for(const c of camposFiltroDeTipo(t)){
    key += '|' + c.id + '=' + valOr(e, c.id);
    if(filtroVis.has(key)) return false;
  }
  return true;
}
function hayFiltrosActivos(){ return filtroVis.size > 0; }
function limpiarFiltros(){ filtroVis.clear(); }
function panelFiltros(base, tiposPresentes){
  const body = el('div', null);
  const estados = [...new Set(base.map(valorEstado).filter(Boolean))].sort();
  const lug = (proyActivo().lugares || []).slice().sort((a, b) => a.pkIni - b.pkIni);
  const refrescar = () => { pinta(); render(); };   /* actualiza el modal Y la vista de debajo al instante */
  const chk = (key, label, depth, extra) => {
    const on = !filtroVis.has(key);
    return el('label', {style:'display:flex;align-items:center;gap:8px;padding:5px 0 5px ' + (2 + depth * 20) + 'px;font-size:13px;cursor:pointer' + (on ? '' : ';opacity:.45')},
      el('input', {type:'checkbox', style:'width:16px;flex:0 0 auto', ...(on ? {checked:'checked'} : {}), onchange:ev => {
        if(ev.target.checked){ for(const k of [...filtroVis]) if(k === key || k.indexOf(key + '|') === 0) filtroVis.delete(k); }
        else filtroVis.add(key);
        refrescar();
      }}),
      extra || null, el('span', null, label));
  };
  function pinta(){
    body.innerHTML = '';
    body.appendChild(el('div', {style:'display:flex;gap:8px;margin-bottom:8px'},
      el('button', {class:'btn sm', onclick:() => { filtroVis.clear(); refrescar(); }}, 'Seleccionar todo'),
      el('button', {class:'btn sm', onclick:() => { filtroVis.clear(); tiposPresentes.forEach(t => filtroVis.add('t:' + t.id)); refrescar(); }}, 'Quitar todo')));
    body.appendChild(el('div', {class:'flab'}, 'Elementos'));
    tiposPresentes.forEach(t => {
      body.appendChild(chk('t:' + t.id, t.nombre, 0, el('span', {class:'swatch', style:'background:' + (t.color || '#888')})));
      const cf = camposFiltroDeTipo(t); if(!cf.length) return;
      const els1 = base.filter(e => e.tipoId === t.id);
      [...new Set(els1.map(e => valOr(e, cf[0].id)))].sort().forEach(v0 => {
        const k1 = 'v:' + t.id + '|' + cf[0].id + '=' + v0;
        body.appendChild(chk(k1, v0 === '∅' ? '(sin ' + cf[0].etiqueta.toLowerCase() + ')' : v0, 1));
        if(cf[1]){
          const vals1 = [...new Set(els1.filter(e => valOr(e, cf[0].id) === v0).map(e => valOr(e, cf[1].id)))].sort();
          if(vals1.length > 1 || vals1[0] !== '∅') vals1.forEach(v1 =>
            body.appendChild(chk(k1 + '|' + cf[1].id + '=' + v1, cf[1].etiqueta + ': ' + (v1 === '∅' ? '—' : v1), 2)));
        }
      });
    });
    if(estados.length){
      body.appendChild(el('div', {class:'flab', style:'margin-top:12px'}, 'Estado'));
      estados.forEach(s => body.appendChild(chk('e:' + s, s, 0)));
    }
    if(lug.length){
      body.appendChild(el('div', {class:'flab', style:'margin-top:12px'}, 'Lugar'));
      lug.forEach(l => body.appendChild(chk('l:' + l.id, l.nombre, 0)));
      body.appendChild(chk('l:∅', '(sin lugar)', 0));
    }
  }
  pinta();
  openModal('Filtros', body, null);
}

      total ? 'Ningún elemento con esos filtros.' : 'Todavía no hay elementos en este proyecto.'));
    return cont;
  }

  let cols = (state.bdCols && state.bdCols.length ? state.bdCols.slice() : ['codigo', 'tipo', 'pk', 'estado']);
  if(!lugares.length) cols = cols.filter(k => k !== 'lugar');
  const sd = bdColDef(bdSort.col);
  const kf = sd.sort || (e => (e.codigo || '').toLowerCase());
  filas.sort((a, b) => {
    let va = kf(a), vb = kf(b);
    const na = (typeof va === 'number' && isNaN(va)), nb = (typeof vb === 'number' && isNaN(vb));
    if(na && nb) return 0; if(na) return 1; if(nb) return -1;   /* vacíos siempre al final */
    if(va < vb) return -bdSort.dir;
    if(va > vb) return bdSort.dir;
    return 0;
  });
  const thS = (label, col) => el('th', {class:'sortable', onclick:() => {
      if(bdSort.col === col) bdSort.dir *= -1; else { bdSort.col = col; bdSort.dir = 1; }
      render();
    }}, label, el('span', {class:'arw'}, bdSort.col === col ? (bdSort.dir > 0 ? '▲' : '▼') : '⇅'));

  const wrap = el('div', {class:'tablewrap'});
  wrap.appendChild(el('table', null,
    el('thead', null, el('tr', null, ...cols.map(k => thS(bdColDef(k).lbl, k)), el('th', null, ''))),
    el('tbody', null, ...filas.map(e => el('tr', null,
      ...cols.map(k => { const d = bdColDef(k); return d.node ? d.node(e) : el('td', d.muted ? {style:'color:var(--tx3);font-size:12px'} : null, d.get(e)); }),
      el('td', null, el('button', {class:'btn sm', onclick:() => nuevoElemento(e.id)}, 'Abrir'))
    )))
  ));
  cont.appendChild(wrap);
  return cont;
}
function bdColDef(k){
  const F = {
    codigo: {lbl:'Código', node:e => el('td', null, el('code', {class:'pill2'}, e.codigo || '—')), sort:e => (e.codigo || '').toLowerCase()},
    tipo:   {lbl:'Tipo', node:e => { const t = getTipo(e.tipoId) || {}; return el('td', null,
              el('span', {class:'swatch', style:'display:inline-block;margin-right:7px;vertical-align:1px;background:' + (t.color || '#888')}), t.nombre || '—'); },
              sort:e => ((getTipo(e.tipoId) || {}).nombre || '').toLowerCase()},
    pk:     {lbl:'PK', get:e => valorPK(e) || '—', sort:e => pkNum(valorPK(e))},
    estado: {lbl:'Estado', node:e => { const est = valorEstado(e); return el('td', null, est ? el('span', {class:'badge ' + estadoBadgeClass(est)}, est) : '—'); },
              sort:e => valorEstado(e).toLowerCase()},
    contr:  {lbl:'Contratista', get:e => valorPorEtiqueta(e, 'Contratista') || '—', sort:e => valorPorEtiqueta(e, 'Contratista').toLowerCase()},
    via:    {lbl:'Vía', get:e => viaDe(e) || '—', sort:e => String(viaDe(e) || '').toLowerCase()},
    lugar:  {lbl:'Lugar', get:e => (lugarDe(e) || {}).nombre || '—', sort:e => ((lugarDe(e) || {}).nombre || '').toLowerCase(), muted:true},
    mod:    {lbl:'Modificado', get:e => e.modificado ? new Date(e.modificado).toLocaleDateString() : '—', sort:e => e.modificado || 0, muted:true},
    creado: {lbl:'Creado', get:e => e.creado ? new Date(e.creado).toLocaleDateString() : '—', sort:e => e.creado || 0, muted:true}
  };
  if(F[k]) return F[k];
  if(k && k.indexOf('campo:') === 0){
    const id = k.slice(6), c = getCampo(id) || {etiqueta:'?'};
    return {lbl:c.etiqueta, get:e => (e.valores && e.valores[id]) || '—', sort:e => String((e.valores && e.valores[id]) || '').toLowerCase(), muted:true};
  }
  return {lbl:k || '', get:() => '—', sort:() => ''};
}

/* reduce una imagen (File) a dataURL JPEG, lado máx ~1400 px, para poder guardarla en el navegador */
function reducirImagen(file, maxLado, q){
  maxLado = maxLado || 1400; q = q || 0.72;
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error('lectura'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('imagen'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const f = Math.min(1, maxLado / Math.max(w, h || 1));
        w = Math.max(1, Math.round(w * f)); h = Math.max(1, Math.round(h * f));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        try { res(cv.toDataURL('image/jpeg', q)); } catch(e){ res(r.result); }
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
/* visor de foto a pantalla completa (clic o Esc para cerrar) */
function verFotoGrande(src){
  let onk;
  const ov = el('div', {id:'lightbox', style:'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out'});
  const cerrar = () => { ov.remove(); document.removeEventListener('keydown', onk); };
  onk = e => { if(e.key === 'Escape') cerrar(); };
  ov.addEventListener('click', cerrar);
  ov.appendChild(el('img', {src, style:'max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.6)'}));
  document.addEventListener('keydown', onk);
  document.body.appendChild(ov);
}
/* widget de foto: botón de adjuntar/hacer foto + miniatura + quitar. El dataURL vive en `hidden.value`. */
function fotoWidget(hidden, ro){
  const wrap = el('div', null);
  const prev = el('div', {style:'margin:6px 0'});
  const repaint = () => {
    prev.innerHTML = '';
    if(hidden.value){
      prev.appendChild(el('img', {src:hidden.value, title:'Ampliar', style:'max-height:110px;max-width:100%;border-radius:8px;border:1px solid var(--line2);display:block;cursor:zoom-in', onclick:() => verFotoGrande(hidden.value)}));
      if(!ro) prev.appendChild(el('button', {class:'btn sm', type:'button', style:'margin-top:6px', onclick:() => { hidden.value = ''; repaint(); }}, 'Quitar foto'));
    } else if(ro){
      prev.appendChild(el('span', {style:'color:var(--tx3);font-size:12px'}, 'Sin foto'));
    }
  };
  if(!ro){
    const fi = el('input', {type:'file', accept:'image/*', capture:'environment'});
    fi.addEventListener('change', ev => {
      const f = ev.target.files && ev.target.files[0]; if(!f) return;
      reducirImagen(f).then(durl => {
        if(durl.length > 3500000 && !confirm('La foto ocupa bastante y puede llenar el almacenamiento del navegador. ¿Guardarla igualmente?')) return;
        hidden.value = durl; repaint();
      }).catch(() => alert('No se pudo procesar la imagen.'));
      ev.target.value = '';
    });
    wrap.appendChild(fi);
  }
  wrap.appendChild(prev);
  repaint();
  return wrap;
}
function nuevoElemento(id, prefill){
  const ex = id ? state.elementos.find(x => x.id === id) : null;
  if(!ex && soloLectura()) return;
  const ro = !!fechaVista;
  const exVal = ex ? (ro ? estadoEnFecha(ex, fechaVista) : {codigo:ex.codigo, valores:ex.valores}) : null;
  let tipoId = ex ? ex.tipoId : ((prefill && prefill.tipoId) || (state.elementTypes[0] && state.elementTypes[0].id));
  if(!tipoId){ alert('Primero crea un tipo de elemento en "Modelo de datos".'); return; }
  const body = el('div', null);
  const selTipo = el('select', {...(ex || ro ? {disabled:'disabled'} : {})},
    ...state.elementTypes.map(t => el('option', {value:t.id, ...(t.id === tipoId ? {selected:'selected'} : {})}, t.nombre)));
  const inCod = el('input', {placeholder:'S-421', value:ex ? (exVal.codigo || '') : '', ...(ro ? {disabled:'disabled'} : {})});
  const camposWrap = el('div', null);
  function pintar(){
    const t = getTipo(selTipo.value);
    camposWrap.innerHTML = '';
    t.campos.forEach(ref => {
      const c = getCampo(ref.campoId); if(!c) return;
      const src = ex ? (exVal.valores || {}) : ((prefill && prefill.valores) || {});
      const val = src[c.id] != null ? src[c.id] : '';
      let input, extra = null;
      if(c.tipo === 'select') input = el('select', null, el('option', {value:''}, '—'),
        ...(c.opciones || []).map(o => el('option', {value:o, ...(o === val ? {selected:'selected'} : {})}, o)));
      else if(c.tipo === 'boolean') input = el('select', null, el('option', {value:''}, '—'),
        el('option', {value:'Sí', ...(val === 'Sí' ? {selected:'selected'} : {})}, 'Sí'),
        el('option', {value:'No', ...(val === 'No' ? {selected:'selected'} : {})}, 'No'));
      else if(c.tipo === 'number') input = el('input', {type:'number', value:val});
      else if(c.tipo === 'date') input = el('input', {type:'date', value:val});
      else if(c.tipo === 'pk') input = el('input', {placeholder:'45+320', value:val});
      else if(c.tipo === 'photo'){ input = el('input', {type:'hidden', value:val}); extra = fotoWidget(input, ro); }
      else if(c.tipo === 'doc') input = el('input', {placeholder:'Nombre de archivo', value:val});
      else if(/observ|caracter/i.test(c.etiqueta)) input = el('textarea', {rows:2}, val);
      else input = el('input', {value:val});
      input.dataset.campo = c.id;
      if(ro && input.type !== 'hidden') input.setAttribute('disabled', 'disabled');
      camposWrap.appendChild(el('div', {class:'field', 'data-fld':c.id},
        el('span', {class:'flab'}, c.etiqueta, ref.obligatorio ? el('span', {class:'req'}, ' *') : ''),
        extra, input, el('div', {class:'err'}, 'Campo obligatorio')
      ));
    });
    aplicarReglas();
  }
  function valoresActuales(){
    const v = {};
    camposWrap.querySelectorAll('[data-campo]').forEach(inp => v[inp.dataset.campo] = inp.value || '');
    return v;
  }
  function aplicarReglas(){
    const t = getTipo(selTipo.value); if(!t) return;
    const v = valoresActuales();
    /* varias pasadas para dependencias encadenadas */
    for(let p = 0; p < Math.max(2, t.campos.length); p++){
      let cambio = false;
      t.campos.forEach(ref => {
        const fld = camposWrap.querySelector('[data-fld="' + ref.campoId + '"]'); if(!fld) return;
        const vis = campoVisible(t, ref, v);
        const antes = fld.style.display !== 'none';
        if(vis !== antes){ fld.style.display = vis ? '' : 'none'; cambio = true; }
        if(!vis){ const inp = fld.querySelector('[data-campo]'); if(inp && v[ref.campoId]){ v[ref.campoId] = ''; } }
      });
      if(!cambio) break;
    }
  }
  selTipo.addEventListener('change', pintar);
  pintar();
  camposWrap.addEventListener('change', aplicarReglas);
  camposWrap.addEventListener('input', aplicarReglas);
  body.appendChild(el('div', {class:'cols2'},
    el('div', {class:'field'}, el('span', {class:'flab'}, 'Tipo de elemento'), selTipo),
    el('div', {class:'field'}, el('span', {class:'flab'}, 'Código'), inCod)
  ));
  body.appendChild(camposWrap);
  openModal(ro ? 'Elemento (a ' + new Date(fechaVista).toLocaleDateString('es-ES') + ')' : (ex ? 'Editar elemento' : 'Nuevo elemento'), body,
    ro ? null : () => {
      const t = getTipo(selTipo.value);
      let ok = true; const valores = {};
      camposWrap.querySelectorAll('[data-campo]').forEach(inp => {
        const ref = t.campos.find(r => r.campoId === inp.dataset.campo);
        const fld = inp.closest('[data-fld]');
        const oculto = fld && fld.style.display === 'none';
        const v = oculto ? '' : (inp.value || '').trim();   /* campo no aplicable → no se guarda */
        valores[inp.dataset.campo] = v;
        const errBox = inp.parentElement.querySelector('.err');
        const falla = !oculto && ref && ref.obligatorio && !v;
        if(errBox) errBox.style.display = falla ? 'block' : 'none';
        if(falla) ok = false;
      });
      if(!ok) return false;
      if(ex){
        const nuevoCod = inCod.value.trim();
        const difs = [];
        if(nuevoCod !== (ex.codigo || '')) difs.push('código "' + (ex.codigo || '∅') + '"→"' + (nuevoCod || '∅') + '"');
        t.campos.forEach(r => {
          const c = getCampo(r.campoId); if(!c) return;
          const a = ex.valores[r.campoId] || '', b = valores[r.campoId] || '';
          if(a === b) return;
          if(c.tipo === 'photo' || c.tipo === 'doc') difs.push(c.etiqueta + (b ? ' actualizada' : ' quitada'));
          else difs.push(c.etiqueta + ' "' + a + '"→"' + b + '"');
        });
        if(difs.length){
          ex.hist = ex.hist || [];
          ex.hist.push({ts:Date.now(), snap:{codigo:ex.codigo, valores:clone(ex.valores), plano:ex.plano ? clone(ex.plano) : null}});
          if(ex.hist.length > 40) ex.hist.shift();
          ex.codigo = nuevoCod; ex.valores = valores; ex.modificado = Date.now();
          registrarCambio('edición', (ex.codigo || getTipo(ex.tipoId).nombre) + ': ' + difs.slice(0, 6).join('; ') + (difs.length > 6 ? '…' : ''), ex.id);
        }
      } else {
        const nid = uid(), cod = inCod.value.trim();
        state.elementos.push({id:nid, proyectoId:state.proyectoActivo, tipoId:selTipo.value, codigo:cod, valores, hist:[], plano:(prefill && prefill.plano) || null, creado:Date.now(), modificado:Date.now()});
        registrarCambio('alta', (cod || getTipo(selTipo.value).nombre) + ' (' + getTipo(selTipo.value).nombre + ')', nid);
      }
      save(); render();
    },
    (ex && !ro) ? () => {
      if(!confirm('¿Borrar este elemento?')) return false;
      ex.borrado = Date.now(); ex.modificado = Date.now();
      registrarCambio('baja', (ex.codigo || getTipo(ex.tipoId).nombre), ex.id);
      save(); render();
    } : null
  );
}

/* nombre de hoja Excel válido: máx 31 car., sin \/*?:[] */
function nombreHoja(s){ return String(s || 'Hoja').replace(/[\\/*?:[\]]/g, ' ').trim().slice(0, 31) || 'Hoja'; }
function campoExportable(c){ return c && c.tipo !== 'photo' && c.tipo !== 'doc'; }
async function exportXLSX(){
  if(typeof ExcelJS === 'undefined'){ alert('No se pudo cargar la librería de Excel (sin conexión). Prueba "Exportar CSV".'); return; }
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Vía · Seguimiento';
  const base = elementosProy();
  state.elementTypes.forEach(t => {
    const campos = t.campos.map(r => getCampo(r.campoId)).filter(campoExportable);
    const ws = wb.addWorksheet(nombreHoja(t.nombre));
    ws.columns = [{header:'Código', key:'codigo', width:16}, ...campos.map(c => ({header:c.etiqueta + (t.campos.find(r => r.campoId === c.id).obligatorio ? ' *' : ''), key:c.id, width:22}))];
    ws.getRow(1).font = {bold:true};
    const filas = base.filter(e => e.tipoId === t.id);
    filas.forEach(e => { const row = {codigo:e.codigo || ''}; campos.forEach(c => row[c.id] = e.valores[c.id] || ''); ws.addRow(row); });
    const RELLENO = 15;
    for(let i = 0; i < RELLENO; i++) ws.addRow({codigo:''});
    const lastRow = 1 + filas.length + RELLENO;
    campos.forEach((c, idx) => {
      if(c.tipo !== 'select' && c.tipo !== 'boolean') return;
      const opts = c.tipo === 'boolean' ? ['Sí', 'No'] : (c.opciones || []);
      if(!opts.length) return;
      const col = idx + 2; /* 1=Código */
      for(let r = 2; r <= lastRow; r++){
        ws.getCell(r, col).dataValidation = {type:'list', allowBlank:true, formulae:['"' + opts.join(',').replace(/"/g, '') + '"']};
      }
    });
  });
  const buf = await wb.xlsx.writeBuffer();
  descargar((proyActivo().nombre || 'elementos').replace(/[^\w\-]+/g, '_') + '.xlsx', buf, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
function celTexto(v){
  if(v == null) return '';
  if(typeof v === 'object'){ if(v.text != null) return String(v.text); if(v.result != null) return String(v.result); if(v.richText) return v.richText.map(r => r.text).join(''); return ''; }
  if(v instanceof Date) return v.toISOString().slice(0, 10);
  return String(v);
}
async function importarXLSXFile(file){
  if(typeof ExcelJS === 'undefined'){ alert('No se pudo cargar la librería de Excel (sin conexión).'); return; }
  destinoProyectoModal(file.name, async pid => {
    state.proyectoActivo = pid; save();
    const buf = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    try{ await wb.xlsx.load(buf); }catch(err){ alert('No se pudo leer el Excel: ' + err.message); return; }
    let creados = 0, actualizados = 0, camposRellenados = 0;
    state.elementTypes.forEach(t => {
      const ws = wb.worksheets.find(w => w.name === nombreHoja(t.nombre)); if(!ws) return;
      const campos = t.campos.map(r => getCampo(r.campoId)).filter(campoExportable);
      const header = ws.getRow(1).values; /* array 1-indexed, [empty,'Código',...] */
      const colFor = {};
      for(let i = 2; i <= header.length; i++){
        const h = celTexto(header[i]).replace(/\s*\*$/, '').trim();
        const c = campos.find(cc => cc.etiqueta === h); if(c) colFor[i] = c.id;
      }
      const pid_ = state.proyectoActivo, now = Date.now();
      for(let r = 2; r <= ws.rowCount; r++){
        const row = ws.getRow(r);
        const cod = celTexto(row.getCell(1).value).trim();
        const valores = {}; let algo = false;
        Object.keys(colFor).forEach(i => { const v = celTexto(row.getCell(+i).value).trim(); if(v){ valores[colFor[i]] = v; algo = true; } });
        if(!cod && !algo) continue;
        let ex = cod ? elementosProy().find(e => e.tipoId === t.id && (e.codigo || '').trim().toLowerCase() === cod.toLowerCase()) : null;
        if(ex){
          let cambio = false;
          Object.keys(valores).forEach(cid => { if(!ex.valores[cid]){ ex.valores[cid] = valores[cid]; cambio = true; camposRellenados++; } });
          if(cambio){ ex.modificado = now; registrarCambio('edición (Excel)', (ex.codigo || t.nombre) + ': ' + Object.keys(valores).length + ' campo(s) revisados', ex.id); actualizados++; }
        } else if(algo || cod){
          const nid = uid();
          state.elementos.push({id:nid, proyectoId:pid_, tipoId:t.id, codigo:cod, valores, hist:[], plano:null, creado:now, modificado:now});
          registrarCambio('alta (Excel)', (cod || t.nombre) + ' (' + t.nombre + ')', nid);
          creados++;
        }
      }
    });
    save(); currentView = 'bd'; render();
    alert('Importación completada: ' + creados + ' elemento(s) nuevo(s), ' + actualizados + ' actualizado(s) con ' + camposRellenados + ' campo(s) rellenado(s).');
  });
}
function exportProyectoJSON(){
  descargar('via-seguimiento_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(state, null, 2), 'application/json');
}
document.getElementById('file-import').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!data.campos || !data.elementTypes) throw new Error('El archivo no es un proyecto de Vía · Seguimiento');
      if(!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')) return;
      state = data; migrar(); selTipoId = state.elementTypes[0] ? state.elementTypes[0].id : null;
      ultimoSnap = JSON.stringify(state); persist(ultimoSnap); render();
    }catch(err){ alert('No se pudo importar: ' + err.message); }
  };
  r.readAsText(f); e.target.value = '';
});
function descargar(nombre, contenido, mime){
  const blob = new Blob([contenido], {type:mime});
  const a = el('a', {href:URL.createObjectURL(blob), download:nombre});
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ================= modal genérico ================= */
let modalEl = null;
function openModal(titulo, bodyNode, onSave, onDelete){
  closeModal();
  const btnDel = onDelete ? el('button', {class:'btn danger', onclick:() => { if(onDelete() !== false) closeModal(); }}, 'Borrar') : null;
  modalEl = el('div', {class:'overlay', onclick:e => { if(e.target === modalEl) closeModal(); }},
    el('div', {class:'modal'},
      el('div', {class:'modal-h'}, el('h2', null, titulo), el('button', {class:'btn icon ghost', onclick:closeModal}, '✕')),
      el('div', {class:'modal-b'}, bodyNode),
      el('div', {class:'modal-f'},
        btnDel || el('span', null), el('span', {class:'spacer'}),
        el('button', {class:'btn', onclick:closeModal}, 'Cancelar'),
        el('button', {class:'btn red', onclick:() => { if(!onSave || onSave() !== false) closeModal(); }}, 'Guardar')
      )
    )
  );
  document.body.appendChild(modalEl);
}
function closeModal(){ if(modalEl){ modalEl.remove(); modalEl = null; } }
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(document.getElementById('lightbox')) return; closeModal(); } });

/* ================= arranque ================= */
load();
ultimoSnap = JSON.stringify(state);
persist(ultimoSnap);
setView('resumen');
if(GH.on){ setGhStatus(GH.syncedRev ? 'ok' : 'never'); syncPull(true); }
window.addEventListener('online', () => { if(GH.on){ setGhStatus('dirty'); if(ghDirty) syncPush(); else syncPull(true); } });
window.addEventListener('offline', () => { if(GH.on) setGhStatus('offline'); });
</script>
