<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vía · Seguimiento de obra</title>
<style>
  :root{
    --bg:#0d141d; --bg2:#111a24; --panel:#16202b; --panel2:#1c2734; --panel3:#233040;
    --line:#26333f; --line2:#33434f;
    --tx:#eef3f7; --tx2:#9db0c0; --tx3:#6a7d8c;
    --red:#e23744; --red2:#c62d39; --redbg:#2a181c;
    --grn:#33c07d; --grnbg:#12291f;
    --amb:#e0a13c; --ambbg:#2c2413;
    --blu:#4d9de0; --blubg:#12263a;
    --rad:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  h1,h2,h3{margin:0;font-weight:650}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;font-size:13px;color:var(--tx);background:var(--panel3);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--redbg)}
  input[type=checkbox]{width:auto}
  input[type=color]{padding:2px;height:38px}
  input[type=range]{padding:0}
  select option{background:var(--panel2)}
  label{display:block}

  .topbar{display:flex;align-items:center;gap:22px;padding:12px 22px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px}
  .brand img{height:26px;width:auto;display:block;border-radius:4px}
  .brand .wordmark{font-weight:800;font-size:18px;letter-spacing:-.5px;color:var(--tx)}
  .brand-sub{color:var(--tx2);font-size:12.5px}
  @media(max-width:900px){.brand-sub{display:none}}
  .brand-modo{background:var(--panel3);border:1px solid var(--line2);color:var(--tx);border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:600;width:auto;max-width:190px}
  .dz-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .dztbl input,.dztbl select{padding:5px 7px;font-size:12px}
  .dztbl th,.dztbl td{padding:6px 8px}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  .navi{border:0;background:transparent;color:var(--tx2);padding:7px 13px;border-radius:8px;font-weight:600;font-size:13px}
  .navi:hover{color:var(--tx);background:var(--panel)}
  .navi.on{background:var(--red);color:#fff}
  #topright{margin-left:auto;display:flex;gap:6px}
  #topright .iconbtn{width:34px;height:34px;font-size:16px}
  #topright .iconbtn:disabled{opacity:.35;cursor:default}

  .subbar{display:flex;align-items:center;gap:10px;padding:10px 22px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:20}
  .iconbtn{width:32px;height:32px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx2);border-radius:8px;display:grid;place-items:center;font-size:15px}
  .iconbtn:hover{color:var(--tx);background:var(--panel3)}
  .proj{margin-left:auto;display:flex;align-items:center;gap:8px}
  .proj .lab{color:var(--tx3);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .proj select{min-width:190px}

  .wrap{max-width:1280px;margin:0 auto;padding:22px}

  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--tx);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--panel3)}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff}
  .btn.red:hover{background:var(--red2)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
  .btn.ghost:hover{background:var(--panel2);color:var(--tx)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{color:var(--red)}
  .btn.icon{padding:6px 8px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .card-h .t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:8px}
  .card-b{padding:16px}
  .dot{width:8px;height:8px;border-radius:50%}

  .sec-title{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  .sec-title .muted{color:var(--tx3);font-size:12px;font-weight:500}

  .hero{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:
    radial-gradient(1100px 320px at 100% 0%, rgba(226,55,68,.20), transparent 60%),
    linear-gradient(120deg,#14202c,#0f1822 62%);position:relative;padding:32px 34px;min-height:180px}
  .hero .eyebrow{color:var(--red);font-weight:800;letter-spacing:.12em;font-size:11px;text-transform:uppercase}
  .hero h1{font-size:26px;margin:8px 0}
  .hero p{color:var(--tx2);max-width:520px;margin:0}
  .hero svg{position:absolute;right:26px;bottom:12px;opacity:.55;pointer-events:none}
  @media(max-width:720px){.hero svg{display:none}}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:23px;font-weight:750;letter-spacing:-.5px}
  .stat .n em{color:var(--red);font-style:normal}
  .stat .l{color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--l,#3a4a58);border-radius:12px;padding:15px 16px;cursor:pointer}
  .pcard:hover{border-color:var(--line2);background:var(--panel2)}
  .pcard .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pcard h3{font-size:15px}
  .pcard .meta{color:var(--tx2);font-size:12.5px;margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .pcard .meta b{color:var(--tx)}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .pill.gray{background:var(--panel3);color:var(--tx2)}
  .pill.green{background:var(--grnbg);color:var(--grn)}
  .pill.amber{background:var(--ambbg);color:var(--amb)}
  .pill.red{background:var(--redbg);color:var(--red)}

  .badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;font-weight:600}
  .badge.gray{background:var(--panel3);color:var(--tx2)}
  .badge.blue{background:var(--blubg);color:var(--blu)}
  .badge.green{background:var(--grnbg);color:var(--grn)}
  .badge.amber{background:var(--ambbg);color:var(--amb)}
  .badge.red{background:var(--redbg);color:var(--red)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);background:var(--panel2);position:sticky;top:0}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel2)}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;margin-top:12px}
  code.pill2{background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;font-size:12px;font-family:ui-monospace,monospace}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar select{width:auto;min-width:150px}
  .spacer{flex:1}

  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 2px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px;min-width:120px}
  .kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3)}
  .kpi .v{font-size:20px;font-weight:700;margin-top:2px}

  .grid3{display:grid;grid-template-columns:250px 300px minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:1050px){.grid3{grid-template-columns:1fr}}
  .list{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
  .row.soft{background:var(--panel2);border-color:transparent}
  .row.pick{cursor:pointer}
  .row.pick:hover{background:var(--panel2);border-color:var(--line2)}
  .row.sel{border-color:var(--red);background:var(--redbg)}
  .row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .count{color:var(--tx3);font-size:12px}
  .swatch{width:11px;height:11px;border-radius:4px;flex:none}
  .hint{font-size:12px;color:var(--tx3);line-height:1.5;margin:10px 2px 0}
  .empty{padding:32px;text-align:center;color:var(--tx3);font-size:13px}
  .note{background:var(--panel);border:1px dashed var(--line2);border-radius:14px;padding:26px;color:var(--tx2)}
  .note h2{font-size:16px;margin-bottom:8px}

  .field{margin-bottom:13px}
  .field .flab{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:600}
  .field .req{color:var(--red)}
  .err{color:var(--red);font-size:12px;margin-top:4px;display:none}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:520px){.cols2{grid-template-columns:1fr}}
  .fieldrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .fieldrow.head{border-top:0;color:var(--tx3);font-size:11px;text-transform:uppercase}
  .fieldrow .mini{display:flex;gap:3px}
  .fieldrow.dragover{border-top:2px solid var(--red)}
  .grip{cursor:grab;color:var(--tx3);user-select:none;text-align:center}

  .dropzone{border:2px dashed var(--line2);border-radius:16px;background:var(--panel);padding:44px;text-align:center}
  .dropzone.drag{border-color:var(--red);background:var(--redbg)}
  .pdf-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
  .pdf-stage{margin-top:12px;background:#0a0f16;border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;max-height:64vh}
  .pdf-stage canvas{display:block;margin:0 auto;background:#fff}

  .esq-wrap{margin-top:12px;background:#0a0f16;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:70vh}
  #esqLayer{position:absolute;left:0;top:0}
  #esqLayer .mk{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #0a0f16;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
  #esqLayer .mk:hover{width:18px;height:18px;z-index:5}
  #esqLayer .mk-bar{position:absolute;height:3px;transform:translateY(-50%);border-radius:3px;opacity:.95;cursor:pointer;min-width:4px}
  #esqLayer .mk-bar:hover{height:6px}
  #esqLayer .mk-lbl{position:absolute;transform:translate(-50%,-100%);font-size:10px;color:#e6edf3;background:rgba(8,12,18,.74);padding:0 3px;border-radius:3px;pointer-events:none;white-space:nowrap}
  .chip.sel{border-color:var(--red);color:var(--tx)}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--tx)}
  th .arw{opacity:.55;font-size:10px;margin-left:2px}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .legend .lg{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border:1px solid var(--line2);border-radius:20px;color:var(--tx2);cursor:pointer;user-select:none}
  .legend .lg.off{opacity:.35}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12px;padding:4px 9px;border:1px solid var(--line2);border-radius:7px;cursor:pointer;color:var(--tx2)}
  .chip:hover{color:var(--tx);border-color:var(--red)}

  .menu{position:absolute;top:48px;left:14px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px;min-width:220px;z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--tx);padding:8px 10px;border-radius:7px;font-size:13px}
  .menu button:hover{background:var(--panel3)}

  .overlay{position:fixed;inset:0;background:rgba(6,10,14,.6);display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;z-index:60}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:580px}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .modal-h h2{font-size:16px}
  .modal-b{padding:18px;max-height:66vh;overflow:auto}
  .modal-f{display:flex;align-items:center;gap:8px;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}

  .ghpill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;font-size:12px;font-weight:600}
  .ghpill .d{width:8px;height:8px;border-radius:50%;background:currentColor}
  .ghpill.ok{color:var(--grn)} .ghpill.amb{color:var(--amb)} .ghpill.red{color:var(--red)}
  .ghpill.blu{color:var(--blu)} .ghpill.gray{color:var(--tx3)}

  @media(max-width:760px){
    input,select,textarea{font-size:16px}          /* evita el zoom al enfocar en iOS */
    .topbar{gap:8px;padding:9px 11px}
    .brand .wordmark{font-size:15px}
    nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    .navi{padding:7px 11px;white-space:nowrap}
    #topright{order:2}
    .subbar{padding:8px 11px;gap:7px}
    .subbar .proj{margin-left:0;width:100%}
    .subbar .proj select{flex:1;min-width:0}
    .wrap{padding:12px}
    .grid3{grid-template-columns:1fr}
    .cols2{grid-template-columns:1fr}
    .kpis{gap:7px}
    .kpi{flex:1 1 44%;min-width:0}
    .stats{grid-template-columns:1fr 1fr}
    .toolbar{gap:7px}
    .toolbar>.btn,.toolbar>select{flex:1 1 auto}
    .overlay{padding:0}
    .modal{max-width:100%;min-height:100vh;border-radius:0;border:0}
    .modal-b{max-height:calc(100vh - 118px)}
    .btn{padding:9px 13px}
    .btn.sm{padding:7px 11px;font-size:12px}
    .fieldrow{grid-template-columns:16px minmax(0,1fr) auto auto;column-gap:7px;font-size:12px}
    .pdf-stage,.esq-wrap{max-height:58vh}
    .hero{padding:20px}
    .hero h1{font-size:20px}
    table th,table td{padding:8px 9px}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand" id="brand"></div>
  <nav id="nav"></nav>
  <div id="topright"></div>
</div>
<div class="subbar" id="subbar"></div>
<div class="wrap"><div id="view"></div></div>
<input type="file" id="file-import" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
