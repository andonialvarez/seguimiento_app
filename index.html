<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vía · Seguimiento de obra</title>
<style>
  :root{
    --bg:#0d141d; --bg2:#111a24; --panel:#16202b; --panel2:#1c2734; --panel3:#233040;
    --line:#26333f; --line2:#33434f;
    --tx:#eef3f7; --tx2:#9db0c0; --tx3:#6a7d8c;
    --red:#e23744; --red2:#c62d39; --redbg:#2a181c;
    --grn:#33c07d; --grnbg:#12291f;
    --amb:#e0a13c; --ambbg:#2c2413;
    --blu:#4d9de0; --blubg:#12263a;
    --rad:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  h1,h2,h3{margin:0;font-weight:650}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;font-size:13px;color:var(--tx);background:var(--panel3);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--redbg)}
  input[type=checkbox]{width:auto}
  input[type=color]{padding:2px;height:38px}
  input[type=range]{padding:0}
  select option{background:var(--panel2)}
  label{display:block}

  .topbar{display:flex;align-items:center;gap:22px;padding:12px 22px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px}
  .brand img{height:26px;width:auto;display:block;border-radius:4px}
  .brand .wordmark{font-weight:800;font-size:18px;letter-spacing:-.5px;color:var(--tx)}
  .brand-sub{color:var(--tx2);font-size:12.5px}
  @media(max-width:900px){.brand-sub{display:none}}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  .navi{border:0;background:transparent;color:var(--tx2);padding:7px 13px;border-radius:8px;font-weight:600;font-size:13px}
  .navi:hover{color:var(--tx);background:var(--panel)}
  .navi.on{background:var(--red);color:#fff}
  #topright{margin-left:auto;display:flex;gap:6px}
  #topright .iconbtn{width:34px;height:34px;font-size:16px}
  #topright .iconbtn:disabled{opacity:.35;cursor:default}

  .subbar{display:flex;align-items:center;gap:10px;padding:10px 22px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:20}
  .iconbtn{width:32px;height:32px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx2);border-radius:8px;display:grid;place-items:center;font-size:15px}
  .iconbtn:hover{color:var(--tx);background:var(--panel3)}
  .proj{margin-left:auto;display:flex;align-items:center;gap:8px}
  .proj .lab{color:var(--tx3);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .proj select{min-width:190px}

  .wrap{max-width:1280px;margin:0 auto;padding:22px}

  .btn{border:1px solid var(--line2);background:var(--panel2);color:var(--tx);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--panel3)}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff}
  .btn.red:hover{background:var(--red2)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
  .btn.ghost:hover{background:var(--panel2);color:var(--tx)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{color:var(--red)}
  .btn.icon{padding:6px 8px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
  .card-h .t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:8px}
  .card-b{padding:16px}
  .dot{width:8px;height:8px;border-radius:50%}

  .sec-title{font-size:15px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  .sec-title .muted{color:var(--tx3);font-size:12px;font-weight:500}

  .hero{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:
    radial-gradient(1100px 320px at 100% 0%, rgba(226,55,68,.20), transparent 60%),
    linear-gradient(120deg,#14202c,#0f1822 62%);position:relative;padding:32px 34px;min-height:180px}
  .hero .eyebrow{color:var(--red);font-weight:800;letter-spacing:.12em;font-size:11px;text-transform:uppercase}
  .hero h1{font-size:26px;margin:8px 0}
  .hero p{color:var(--tx2);max-width:520px;margin:0}
  .hero svg{position:absolute;right:26px;bottom:12px;opacity:.55;pointer-events:none}
  @media(max-width:720px){.hero svg{display:none}}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:23px;font-weight:750;letter-spacing:-.5px}
  .stat .n em{color:var(--red);font-style:normal}
  .stat .l{color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--l,#3a4a58);border-radius:12px;padding:15px 16px;cursor:pointer}
  .pcard:hover{border-color:var(--line2);background:var(--panel2)}
  .pcard .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pcard h3{font-size:15px}
  .pcard .meta{color:var(--tx2);font-size:12.5px;margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .pcard .meta b{color:var(--tx)}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .pill.gray{background:var(--panel3);color:var(--tx2)}
  .pill.green{background:var(--grnbg);color:var(--grn)}
  .pill.amber{background:var(--ambbg);color:var(--amb)}
  .pill.red{background:var(--redbg);color:var(--red)}

  .badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;font-weight:600}
  .badge.gray{background:var(--panel3);color:var(--tx2)}
  .badge.blue{background:var(--blubg);color:var(--blu)}
  .badge.green{background:var(--grnbg);color:var(--grn)}
  .badge.amber{background:var(--ambbg);color:var(--amb)}
  .badge.red{background:var(--redbg);color:var(--red)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);background:var(--panel2);position:sticky;top:0}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel2)}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto;margin-top:12px}
  code.pill2{background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;font-size:12px;font-family:ui-monospace,monospace}

  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar select{width:auto;min-width:150px}
  .spacer{flex:1}

  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 2px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px;min-width:120px}
  .kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3)}
  .kpi .v{font-size:20px;font-weight:700;margin-top:2px}

  .grid3{display:grid;grid-template-columns:250px 300px minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:1050px){.grid3{grid-template-columns:1fr}}
  .list{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:9px}
  .row.soft{background:var(--panel2);border-color:transparent}
  .row.pick{cursor:pointer}
  .row.pick:hover{background:var(--panel2);border-color:var(--line2)}
  .row.sel{border-color:var(--red);background:var(--redbg)}
  .row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .count{color:var(--tx3);font-size:12px}
  .swatch{width:11px;height:11px;border-radius:4px;flex:none}
  .hint{font-size:12px;color:var(--tx3);line-height:1.5;margin:10px 2px 0}
  .empty{padding:32px;text-align:center;color:var(--tx3);font-size:13px}
  .note{background:var(--panel);border:1px dashed var(--line2);border-radius:14px;padding:26px;color:var(--tx2)}
  .note h2{font-size:16px;margin-bottom:8px}

  .field{margin-bottom:13px}
  .field .flab{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:600}
  .field .req{color:var(--red)}
  .err{color:var(--red);font-size:12px;margin-top:4px;display:none}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:520px){.cols2{grid-template-columns:1fr}}
  .fieldrow{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .fieldrow.head{border-top:0;color:var(--tx3);font-size:11px;text-transform:uppercase}
  .fieldrow .mini{display:flex;gap:3px}
  .fieldrow.dragover{border-top:2px solid var(--red)}
  .grip{cursor:grab;color:var(--tx3);user-select:none;text-align:center}

  .dropzone{border:2px dashed var(--line2);border-radius:16px;background:var(--panel);padding:44px;text-align:center}
  .dropzone.drag{border-color:var(--red);background:var(--redbg)}
  .pdf-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
  .pdf-stage{margin-top:12px;background:#0a0f16;border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;max-height:64vh}
  .pdf-stage canvas{display:block;margin:0 auto;background:#fff}

  .esq-wrap{margin-top:12px;background:#0a0f16;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:70vh}
  #esqLayer{position:absolute;left:0;top:0}
  #esqLayer .mk{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #0a0f16;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
  #esqLayer .mk:hover{width:18px;height:18px;z-index:5}
  #esqLayer .mk-bar{position:absolute;height:3px;transform:translateY(-50%);border-radius:3px;opacity:.95;cursor:pointer;min-width:4px}
  #esqLayer .mk-bar:hover{height:6px}
  #esqLayer .mk-lbl{position:absolute;transform:translate(-50%,-100%);font-size:10px;color:#e6edf3;background:rgba(8,12,18,.74);padding:0 3px;border-radius:3px;pointer-events:none;white-space:nowrap}
  .chip.sel{border-color:var(--red);color:var(--tx)}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--tx)}
  th .arw{opacity:.55;font-size:10px;margin-left:2px}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .legend .lg{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border:1px solid var(--line2);border-radius:20px;color:var(--tx2);cursor:pointer;user-select:none}
  .legend .lg.off{opacity:.35}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12px;padding:4px 9px;border:1px solid var(--line2);border-radius:7px;cursor:pointer;color:var(--tx2)}
  .chip:hover{color:var(--tx);border-color:var(--red)}

  .menu{position:absolute;top:48px;left:14px;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px;min-width:220px;z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .menu button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--tx);padding:8px 10px;border-radius:7px;font-size:13px}
  .menu button:hover{background:var(--panel3)}

  .overlay{position:fixed;inset:0;background:rgba(6,10,14,.6);display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;z-index:60}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:580px}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .modal-h h2{font-size:16px}
  .modal-b{padding:18px;max-height:66vh;overflow:auto}
  .modal-f{display:flex;align-items:center;gap:8px;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}

  .ghpill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border:1px solid var(--line2);background:var(--panel2);border-radius:8px;font-size:12px;font-weight:600}
  .ghpill .d{width:8px;height:8px;border-radius:50%;background:currentColor}
  .ghpill.ok{color:var(--grn)} .ghpill.amb{color:var(--amb)} .ghpill.red{color:var(--red)}
  .ghpill.blu{color:var(--blu)} .ghpill.gray{color:var(--tx3)}

  @media(max-width:760px){
    input,select,textarea{font-size:16px}          /* evita el zoom al enfocar en iOS */
    .topbar{gap:8px;padding:9px 11px}
    .brand .wordmark{font-size:15px}
    nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    .navi{padding:7px 11px;white-space:nowrap}
    #topright{order:2}
    .subbar{padding:8px 11px;gap:7px}
    .subbar .proj{margin-left:0;width:100%}
    .subbar .proj select{flex:1;min-width:0}
    .wrap{padding:12px}
    .grid3{grid-template-columns:1fr}
    .cols2{grid-template-columns:1fr}
    .kpis{gap:7px}
    .kpi{flex:1 1 44%;min-width:0}
    .stats{grid-template-columns:1fr 1fr}
    .toolbar{gap:7px}
    .toolbar>.btn,.toolbar>select{flex:1 1 auto}
    .overlay{padding:0}
    .modal{max-width:100%;min-height:100vh;border-radius:0;border:0}
    .modal-b{max-height:calc(100vh - 118px)}
    .btn{padding:9px 13px}
    .btn.sm{padding:7px 11px;font-size:12px}
    .fieldrow{grid-template-columns:16px minmax(0,1fr) auto auto;column-gap:7px;font-size:12px}
    .pdf-stage,.esq-wrap{max-height:58vh}
    .hero{padding:20px}
    .hero h1{font-size:20px}
    table th,table td{padding:8px 9px}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand" id="brand"></div>
  <nav id="nav"></nav>
  <div id="topright"></div>
</div>
<div class="subbar" id="subbar"></div>
<div class="wrap"><div id="view"></div></div>
<input type="file" id="file-import" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
"use strict";

/* ================= utilidades ================= */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if(props) for(const k in props){
    if(k === 'class') n.className = props[k];
    else if(k === 'html') n.innerHTML = props[k];
    else if(k.startsWith('on') && typeof props[k] === 'function') n.addEventListener(k.slice(2), props[k]);
    else if(props[k] != null && props[k] !== false) n.setAttribute(k, props[k]);
  }
  for(const c of kids.flat()){ if(c == null || c === false) continue; n.appendChild((typeof c === 'string' || typeof c === 'number') ? document.createTextNode(String(c)) : c); }
  return n;
}
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= tipos de campo primitivos ================= */
const PRIMITIVOS = [
  {id:'text',    nombre:'Texto'},
  {id:'number',  nombre:'Número'},
  {id:'date',    nombre:'Fecha'},
  {id:'select',  nombre:'Lista desplegable'},
  {id:'boolean', nombre:'Sí / No'},
  {id:'pk',      nombre:'PK (punto km)'},
  {id:'photo',   nombre:'Foto'},
  {id:'doc',     nombre:'Documento'},
];
const primNombre = id => (PRIMITIVOS.find(p => p.id === id) || {}).nombre || id;

/* ================= semilla ================= */
function semilla(){
  const campos = [
    {id:'f_pk',      etiqueta:'PK',                   tipo:'pk'},
    {id:'f_pkini',   etiqueta:'PK inicio',            tipo:'pk'},
    {id:'f_pkfin',   etiqueta:'PK fin',               tipo:'pk'},
    {id:'f_via',     etiqueta:'Vía',                  tipo:'text'},
    {id:'f_lado',    etiqueta:'Lado / ubicación',     tipo:'select', opciones:['Lado izquierdo (arriba)','Lado derecho (abajo)','Entrevías','Vía par','Vía impar','Talud','Cruce bajo vía']},
    {id:'f_estado',  etiqueta:'Estado de montaje',    tipo:'select', opciones:['Pendiente','En ejecución','Instalado','Verificado','Con incidencia']},
    {id:'f_tsenal',  etiqueta:'Tipo de señal',        tipo:'select', opciones:['Avanzada','Entrada','Salida','Maniobra','Retroceso']},
    {id:'f_sdisp',   etiqueta:'Disposición de focos', tipo:'select', opciones:['Alta (una fila)','Baja (focos 2×2)']},
    {id:'f_sfocos',  etiqueta:'Nº de focos',          tipo:'select', opciones:['2','3','4','5']},
    {id:'f_tcanal',  etiqueta:'Tipo de canalización', tipo:'select', opciones:['Canaleta','Canalización de tubo Ø6','Canalización de tubo Ø8','Canalización de tubo Ø12','Zanja hormigonada','Cruce bajo vía']},
    {id:'f_ntubos',  etiqueta:'Nº de tubos',          tipo:'number'},
    {id:'f_tcable',  etiqueta:'Tipo de cable',        tipo:'select', opciones:['Señalización','Energía','Fibra óptica','Cuadrete','Varios cuadretes','Mando','Tierra']},
    {id:'f_ncuad',   etiqueta:'Nº de cuadretes',      tipo:'number'},
    {id:'f_seccion', etiqueta:'Sección / características', tipo:'text'},
    {id:'f_tarq',    etiqueta:'Tipo de arqueta',      tipo:'select', opciones:['Tipo A1','Tipo A2','Tipo D','Tipo H','Registro','Pozo de tiro']},
    {id:'f_prof',    etiqueta:'Profundidad (m)',      tipo:'number'},
    {id:'f_long',    etiqueta:'Longitud (m)',         tipo:'number'},
    {id:'f_senasoc', etiqueta:'Señal asociada',       tipo:'text'},
    {id:'f_distsen', etiqueta:'Distancia a señal (m)', tipo:'text'},
    {id:'f_finst',   etiqueta:'Fecha de instalación', tipo:'date'},
    {id:'f_contr',   etiqueta:'Contratista',          tipo:'text'},
    {id:'f_obs',     etiqueta:'Observaciones',        tipo:'text'},
    {id:'f_foto',    etiqueta:'Foto de montaje',      tipo:'photo'},
    {id:'f_cert',    etiqueta:'Certificación',        tipo:'select', opciones:['Sin certificar','Acopiado','Certificado']},
    {id:'f_nacopio', etiqueta:'Nº de acopio',         tipo:'text'},
    {id:'f_cant',    etiqueta:'Cantidad (medición)',  tipo:'number'},
    {id:'f_certcant',etiqueta:'Cantidad certificada', tipo:'number'},
  ];
  const c = (id, oblig) => ({campoId:id, obligatorio:!!oblig});
  const CERT = [c('f_cert',0), c('f_nacopio',0), c('f_cant',0), c('f_certcant',0)];
  const elementTypes = [
    {id:'t_senal', nombre:'Señal',            prefijo:'S',   color:'#e23744', campos:[c('f_pk',1),c('f_via',1),c('f_tsenal',1),c('f_sdisp',0),c('f_sfocos',0),c('f_estado',1),c('f_finst',0),c('f_contr',0),c('f_obs',0),c('f_foto',0),...CERT]},
    {id:'t_aguja', nombre:'Aguja / desvío',   prefijo:'AG',  color:'#e0a13c', campos:[c('f_pk',1),c('f_via',0),c('f_estado',1),c('f_finst',0),c('f_contr',0),c('f_obs',0),...CERT]},
    {id:'t_cdv',   nombre:'Circuito de vía',  prefijo:'CDV', color:'#33c07d', campos:[c('f_pkini',1),c('f_pkfin',1),c('f_via',0),c('f_estado',1),c('f_obs',0),...CERT]},
    {id:'t_bal',   nombre:'Baliza ASFA',      prefijo:'BAL', color:'#8a6cd6', campos:[c('f_pk',1),c('f_senasoc',0),c('f_distsen',0),c('f_via',0),c('f_estado',1),c('f_obs',0),...CERT]},

/* ================= persistencia + undo ================= */
const KEY = 'via-seguimiento-v3';
let state, ultimoSnap = null, undoStack = [], redoStack = [];
function migrar(){
  if(!state || !state.campos || !state.elementTypes) state = semilla();
  if(!state.elementos) state.elementos = [];
  if(!state.patrones) state.patrones = defaultPatrones();
  if(!Array.isArray(state.proyectos) || !state.proyectos.length){
    const id = uid();
    state.proyectos = [{id, nombre:'Proyecto 1', creado:Date.now(), pdf:''}];
    state.proyectoActivo = id;
  }
  if(!state.proyectoActivo || !state.proyectos.some(p => p.id === state.proyectoActivo))
    state.proyectoActivo = state.proyectos[0].id;
  state.elementos.forEach(e => { if(!e.proyectoId) e.proyectoId = state.proyectoActivo; });
  /* campos de certificación en todos los tipos (para proyectos anteriores) */
  const certDefs = [
    {id:'f_cert', etiqueta:'Certificación', tipo:'select', opciones:['Sin certificar','Acopiado','Certificado']},
    {id:'f_nacopio', etiqueta:'Nº de acopio', tipo:'text'},
    {id:'f_cant', etiqueta:'Cantidad (medición)', tipo:'number'},
    {id:'f_certcant', etiqueta:'Cantidad certificada', tipo:'number'}
  ];
  certDefs.forEach(d => { if(!state.campos.some(c => c.id === d.id)) state.campos.push(d); });
  state.elementTypes.forEach(t => {
    if(t.id === 't_cert') return;   /* el propio tipo Certificación no lleva el estado de certificación */
    certDefs.forEach(d => { if(!t.campos.some(r => r.campoId === d.id)) t.campos.push({campoId:d.id, obligatorio:false}); });
  });
  /* campos de simbología de señal */
  const senDefs = [
    {id:'f_sdisp', etiqueta:'Disposición de focos', tipo:'select', opciones:['Alta (una fila)', 'Baja (focos 2×2)']},
    {id:'f_sfocos', etiqueta:'Nº de focos', tipo:'select', opciones:['2', '3', '4', '5']}
  ];
  senDefs.forEach(d => { if(!state.campos.some(c => c.id === d.id)) state.campos.push(d); });
  const ts = getTipo('t_senal');
  if(ts) senDefs.forEach(d => { if(!ts.campos.some(r => r.campoId === d.id)) ts.campos.push({campoId:d.id, obligatorio:false}); });
  /* opciones izquierda/derecha (= arriba/abajo de la vía) en Lado / ubicación */
  const ladoCp = state.campos.find(c => c.id === 'f_lado');
  if(ladoCp){
    ladoCp.opciones = ladoCp.opciones || [];
    ['Lado izquierdo (arriba)', 'Lado derecho (abajo)'].forEach((o, i) => { if(!ladoCp.opciones.includes(o)) ladoCp.opciones.splice(i, 0, o); });
  }
  /* Lado / ubicación disponible también en señales, balizas, contadores, piquetes y cableado */
  if(!state.ladoAmpliado){
    ['t_senal', 't_bal', 't_ce', 't_piq', 't_cable', 't_cdv'].forEach(id => {
      const tp = getTipo(id);
      if(tp && !tp.campos.some(r => r.campoId === 'f_lado')){
        const iObs = tp.campos.findIndex(r => r.campoId === 'f_obs');
        tp.campos.splice(iObs < 0 ? tp.campos.length : iObs, 0, {campoId:'f_lado', obligatorio:false});
      }
    });
    state.ladoAmpliado = true;
  }
  /* el tipo "Certificación" se retiró: se elimina si no tiene elementos propios */
  const tc = getTipo('t_cert');
  if(tc && !state.elementos.some(e => e.tipoId === 't_cert' && !e.borrado))
    state.elementTypes = state.elementTypes.filter(t => t.id !== 't_cert');
  /* historial / soft-delete / vías dibujadas */
  state.proyectos.forEach(p => {
    if(!Array.isArray(p.historial)) p.historial = [];
    if(!Array.isArray(p.vias)) p.vias = [];
    if(!Array.isArray(p.lugares)) p.lugares = [];
  });
  state.elementos.forEach(e => { if(!Array.isArray(e.hist)) e.hist = []; });
  if(!Array.isArray(state.bdCols)) state.bdCols = ['codigo', 'tipo', 'pk', 'estado', 'contr', 'lugar', 'mod'];
  /* reglas de campos condicionales por defecto (una sola vez) */
  if(!state.reglasSeed){
    state.elementTypes.forEach(t => {
      const set = (cid, regla) => { const r = t.campos.find(x => x.campoId === cid); if(r && !r.regla) r.regla = regla; };
      set('f_nacopio', {juntar:'Y', conds:[{campoId:'f_cert', op:'es', valor:'Acopiado'}]});
      if(t.id === 't_cable') set('f_ncuad', {juntar:'Y', conds:[{campoId:'f_tcable', op:'unoDe', valor:['Cuadrete', 'Varios cuadretes']}]});
      if(t.id === 't_canal') set('f_ntubos', {juntar:'Y', conds:[{campoId:'f_tcanal', op:'unoDe', valor:['Canalización de tubo Ø6', 'Canalización de tubo Ø8', 'Canalización de tubo Ø12']}]});
    });
    state.reglasSeed = true;
  }
}
function load(){
  try{ const raw = localStorage.getItem(KEY); state = raw ? JSON.parse(raw) : semilla(); }
  catch(e){ state = semilla(); }
  migrar();
}
function persist(s){ try{ localStorage.setItem(KEY, s); }catch(e){ alert('No se pudo guardar: ' + e.message); } }
function save(){
  const snap = JSON.stringify(state);
  if(ultimoSnap !== null && ultimoSnap !== snap){ undoStack.push(ultimoSnap); if(undoStack.length > 60) undoStack.shift(); redoStack = []; }
  ultimoSnap = snap; persist(snap);
  if(typeof GH !== 'undefined' && GH.on){ ghDirty = true; if(ghStatus !== 'conflict') setGhStatus('dirty'); clearTimeout(ghPushTimer); ghPushTimer = setTimeout(() => syncPush(), 3500); }
}
function deshacer(){ if(!undoStack.length) return; redoStack.push(ultimoSnap); const s = undoStack.pop(); state = JSON.parse(s); ultimoSnap = s; persist(s); render(); }
function rehacer(){ if(!redoStack.length) return; undoStack.push(ultimoSnap); const s = redoStack.pop(); state = JSON.parse(s); ultimoSnap = s; persist(s); render(); }

/* ================= sincronización con GitHub ================= */
const GH = {
  get token(){ return localStorage.getItem('vs-gh-token') || ''; },
  set token(v){ v ? localStorage.setItem('vs-gh-token', v.trim()) : localStorage.removeItem('vs-gh-token'); },
  get repo(){ return localStorage.getItem('vs-gh-repo') || 'andonialvarez/Seguimiento_obra'; },
  set repo(v){ localStorage.setItem('vs-gh-repo', (v || '').trim() || 'andonialvarez/Seguimiento_obra'); },
  get branch(){ return localStorage.getItem('vs-gh-branch') || 'main'; },
  set branch(v){ localStorage.setItem('vs-gh-branch', (v || '').trim() || 'main'); },
  get sha(){ return localStorage.getItem('vs-gh-sha') || ''; },
  set sha(v){ v ? localStorage.setItem('vs-gh-sha', v) : localStorage.removeItem('vs-gh-sha'); },
  get syncedRev(){ return +localStorage.getItem('vs-gh-rev') || 0; },
  set syncedRev(v){ localStorage.setItem('vs-gh-rev', String(v || 0)); },
  get lastSync(){ return +localStorage.getItem('vs-gh-last') || 0; },
  set lastSync(v){ localStorage.setItem('vs-gh-last', String(v || 0)); },
  get on(){ return !!this.token; }
};
let ghDirty = false, ghStatus = 'off', ghBusy = false, ghPushTimer = null;
function ghDevice(){ let d = localStorage.getItem('vs-gh-dev'); if(!d){ d = Math.random().toString(36).slice(2, 7); localStorage.setItem('vs-gh-dev', d); } return d; }
function setGhStatus(s){ ghStatus = s; const tr = document.getElementById('topright'); if(tr) renderTopRight(); }
function b64EncUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecUtf8(b64){ return decodeURIComponent(escape(atob(String(b64).replace(/\s/g, '')))); }
function fotoId(s){ let h = 5381; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36) + s.length.toString(36); }
function walkStrings(obj, fn){
  if(Array.isArray(obj)){ for(let i = 0; i < obj.length; i++){ const v = obj[i]; if(typeof v === 'string') obj[i] = fn(v); else if(v && typeof v === 'object') walkStrings(v, fn); } }
  else if(obj && typeof obj === 'object'){ for(const k in obj){ const v = obj[k]; if(typeof v === 'string') obj[k] = fn(v); else if(v && typeof v === 'object') walkStrings(v, fn); } }
}
function localTieneDatos(){ return (state.elementos && state.elementos.length > 0) || (state.proyectos && state.proyectos.length > 1); }
async function ghApi(path, opts){
  return fetch('https://api.github.com/repos/' + GH.repo + path, Object.assign({
    headers: { 'Authorization': 'Bearer ' + GH.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
  }, opts || {}));
}
async function ghGetJson(){
  const r = await ghApi('/contents/proyecto.json?ref=' + encodeURIComponent(GH.branch) + '&t=' + Date.now());
  if(r.status === 404) return { missing: true };
  if(!r.ok) throw new Error('GitHub ' + r.status + ' ' + (await r.text()).slice(0, 160));
  const j = await r.json();
  return { data: JSON.parse(b64DecUtf8(j.content)), sha: j.sha };
}
async function ghFetchFoto(id){
  const r = await ghApi('/contents/fotos/' + id + '.jpg?ref=' + encodeURIComponent(GH.branch));
  if(!r.ok) return null;
  const j = await r.json();
  return 'data:image/jpeg;base64,' + String(j.content).replace(/\s/g, '');
}
async function ghRehidratarFotos(obj){
  const ids = new Set();
  walkStrings(obj, s => { const m = /^##foto:(.+)$/.exec(s); if(m) ids.add(m[1]); return s; });
  const map = {};
  for(const id of ids){ try{ map[id] = await ghFetchFoto(id); }catch(e){} }
  walkStrings(obj, s => { const m = /^##foto:(.+)$/.exec(s); return (m && map[m[1]]) ? map[m[1]] : s; });
  return obj;
}
async function syncPull(silent){
  if(!GH.on || ghBusy) return;
  ghBusy = true; setGhStatus('busy');
  try{
    const res = await ghGetJson();
    if(res.missing){ setGhStatus(localTieneDatos() ? 'dirty' : 'never'); ghBusy = false; return; }
    GH.sha = res.sha;
    const remoteRev = +(res.data.__rev || 0);
    if(remoteRev && remoteRev === GH.syncedRev){ setGhStatus(ghDirty ? 'dirty' : 'ok'); GH.lastSync = Date.now(); ghBusy = false; return; }
    const primeraVez = GH.syncedRev === 0;
    if((ghDirty || (primeraVez && localTieneDatos())) && remoteRev !== GH.syncedRev){
      ghBusy = false; setGhStatus('conflict');
      if(!silent) mostrarConflicto(res);
      return;
    }
    await ghRehidratarFotos(res.data);
    delete res.data.__rev; delete res.data.__device;
    state = res.data; migrar();
    ultimoSnap = JSON.stringify(state); persist(ultimoSnap);
    GH.syncedRev = remoteRev; GH.lastSync = Date.now(); ghDirty = false;
    setGhStatus('ok'); render();
  }catch(e){
    setGhStatus(navigator.onLine ? 'error' : 'offline');
    if(!silent) alert('No se pudo sincronizar (bajar): ' + e.message);
  }
  ghBusy = false;
}
async function syncPush(){
  if(!GH.on || ghBusy) return;
  if(!navigator.onLine){ setGhStatus('offline'); return; }
  ghBusy = true; setGhStatus('busy');
  try{
    const clone = JSON.parse(JSON.stringify(state));
    const fotos = {};
    walkStrings(clone, s => { if(/^data:image\//.test(s)){ const id = fotoId(s); fotos[id] = s; return '##foto:' + id; } return s; });
    for(const id in fotos){
      const chk = await ghApi('/contents/fotos/' + id + '.jpg?ref=' + encodeURIComponent(GH.branch));
      if(chk.status === 200) continue;
      const b64 = fotos[id].replace(/^data:image\/[^;]+;base64,/, '');
      const put = await ghApi('/contents/fotos/' + id + '.jpg', { method: 'PUT',
        body: JSON.stringify({ message: 'foto ' + id, content: b64, branch: GH.branch }) });
      if(!put.ok && put.status !== 422) throw new Error('foto ' + id + ': ' + put.status);
    }
    const rev = Date.now();
    clone.__rev = rev; clone.__device = ghDevice();
    const body = { message: 'sync ' + new Date(rev).toISOString().slice(0, 19).replace('T', ' '), content: b64EncUtf8(JSON.stringify(clone)), branch: GH.branch };
    if(GH.sha) body.sha = GH.sha;
    let put = await ghApi('/contents/proyecto.json', { method: 'PUT', body: JSON.stringify(body) });
    if(put.status === 409 || put.status === 422){
      const res = await ghGetJson();
      if(res.missing){ delete body.sha; put = await ghApi('/contents/proyecto.json', { method: 'PUT', body: JSON.stringify(body) }); }
      else if(+(res.data.__rev || 0) !== GH.syncedRev){ ghBusy = false; setGhStatus('conflict'); mostrarConflicto(res); return; }
      else { body.sha = res.sha; put = await ghApi('/contents/proyecto.json', { method: 'PUT', body: JSON.stringify(body) }); }
    }
    if(!put.ok) throw new Error('GitHub ' + put.status + ' ' + (await put.text()).slice(0, 160));
    const pj = await put.json();
    GH.sha = pj.content.sha; GH.syncedRev = rev; GH.lastSync = Date.now(); ghDirty = false;
    setGhStatus('ok');
  }catch(e){
    setGhStatus(navigator.onLine ? 'error' : 'offline');
    if(ghStatus === 'error') console.warn('sync push:', e);
  }
  ghBusy = false;
}
function mostrarConflicto(res){
  openModal('Conflicto de sincronización',
    el('div', null,
      el('p', null, 'La versión en la nube y la de este dispositivo se han modificado por separado. Elige cuál conservar:'),
      el('p', {class:'hint'}, 'Nube: ' + (res.data.__rev ? new Date(+res.data.__rev).toLocaleString('es-ES') : '—') +
        ' · dispositivo "' + (res.data.__device || '?') + '"')
    ),
    () => false,
    null
  );
  const f = modalEl && modalEl.querySelector('.modal-f');
  if(f){
    f.innerHTML = '';
    f.appendChild(el('button', {class:'btn', onclick:async () => {
      closeModal(); ghBusy = true; setGhStatus('busy');
      try{ await ghRehidratarFotos(res.data); delete res.data.__rev; delete res.data.__device;
        state = res.data; migrar(); ultimoSnap = JSON.stringify(state); persist(ultimoSnap);
        GH.sha = res.sha; GH.syncedRev = +(res.data.__rev || 0) || Date.now(); ghDirty = false;
        setGhStatus('ok'); render();
      }catch(e){ alert('Error: ' + e.message); }
      ghBusy = false;
    }}, 'Usar la de la nube'));
    f.appendChild(el('span', {class:'spacer'}));
    f.appendChild(el('button', {class:'btn red', onclick:async () => {
      closeModal(); GH.sha = res.sha; GH.syncedRev = +(res.data.__rev || 0); ghDirty = true;
      await syncPush();
    }}, 'Subir la de este dispositivo'));
  }
}
async function syncAhora(){
  if(!GH.on){ alert('Primero configura el token en Ajustes → Sincronización.'); return; }
  await syncPull(false);
  if(ghStatus === 'conflict') return;
  if(ghDirty || ghStatus === 'never' || ghStatus === 'dirty') await syncPush();
}

/* ================= helpers de modelo ================= */
const getCampo = id => state.campos.find(c => c.id === id);
const getTipo  = id => state.elementTypes.find(t => t.id === id);
const contarPorTipo = id => state.elementos.filter(e => e.tipoId === id).length;
const proyActivo = () => state.proyectos.find(p => p.id === state.proyectoActivo) || state.proyectos[0];
let fechaVista = null;   /* ms (fin del día) o null = hoy */
function estadoEnFecha(e, f){
  if(!e.hist || !e.hist.length) return {codigo:e.codigo, valores:e.valores, plano:e.plano};
  for(const h of e.hist){ if(h.ts > f) return h.snap; }
  return {codigo:e.codigo, valores:e.valores, plano:e.plano};
}
function elementosProy(){
  const f = fechaVista;
  return state.elementos
    .filter(e => e.proyectoId === state.proyectoActivo)
    .filter(e => f ? ((e.creado || 0) <= f && !(e.borrado && e.borrado <= f)) : !e.borrado)
    .map(e => { if(!f) return e; const s = estadoEnFecha(e, f); return Object.assign({}, e, {codigo:s.codigo, valores:s.valores || {}, plano:s.plano || null}); });
}
function soloLectura(){
  if(fechaVista){ alert('Estás viendo el proyecto a una fecha pasada (solo lectura). Pulsa "Hoy" para volver y editar.'); return true; }
  return false;
}
function registrarCambio(accion, detalle, ref){
  const pr = proyActivo(); if(!pr) return;
  pr.historial = pr.historial || [];
  pr.historial.push({ts:Date.now(), accion, detalle:detalle || '', ref:ref || null});
  if(pr.historial.length > 3000) pr.historial.splice(0, pr.historial.length - 3000);
}
function estadoBadgeClass(val){
  const v = (val || '').toLowerCase();
  if(v.includes('verific')) return 'green';
  if(v.includes('incidenc')) return 'red';
  if(v.includes('ejecuc')) return 'amber';
  if(v.includes('instal')) return 'blue';
  return 'gray';
}
function pkNum(s){
  s = String(s == null ? '' : s).trim().replace(/^k?m\.?\s*/i, '').replace(/\s+/g, '');
  if(!s) return NaN;
  let m = s.match(/^(\d+)\+(\d{1,3})$/);
  if(m) return +m[1] + (+m[2].padEnd(3, '0')) / 1000;
  m = s.match(/^(\d{1,4})[.,](\d{1,3})$/);
  if(m) return +m[1] + (+m[2].padEnd(3, '0')) / 1000;
  const f = parseFloat(s.replace(',', '.'));
  return isFinite(f) ? f : NaN;
}
function toPkStr(km){ const t = Math.round(km * 1000); return Math.floor(t / 1000) + ',' + String(((t % 1000) + 1000) % 1000).padStart(3, '0'); }
function fmtKm(v){ return isNaN(v) ? '—' : v.toFixed(3).replace('.', ',') + ' km'; }
function elemPK(e){
  const t = getTipo(e.tipoId); if(!t) return {ini:NaN, fin:NaN, pu:NaN};
  let ini = NaN, fin = NaN, pu = NaN;
  t.campos.forEach(r => {
    const c = getCampo(r.campoId); if(!c || c.tipo !== 'pk') return;
    const v = pkNum(e.valores[r.campoId]); if(isNaN(v)) return;
    if(/inicio|desde/i.test(c.etiqueta)) ini = v;
    else if(/\bfin\b|hasta/i.test(c.etiqueta)) fin = v;
    else pu = v;
  });
  if(isNaN(pu) && !isNaN(ini) && isNaN(fin)) pu = ini;
  return {ini, fin, pu};
}
function viaDe(e){
  const t = getTipo(e.tipoId); if(!t) return '';
  const r = t.campos.find(rr => { const c = getCampo(rr.campoId); return c && /v[ií]a/i.test(c.etiqueta); });
  return r ? (e.valores[r.campoId] || '') : '';
}
/* posición vertical respecto a la vía por el campo Lado/ubicación:
   -1 = arriba (lado izquierdo), 1 = abajo (lado derecho), 0 = sin definir.
   Sentido de avance izq→der (PK creciente): derecha = abajo, izquierda = arriba. */
function ladoVert(e){
  const t = getTipo(e.tipoId); if(!t) return 0;
  const ref = t.campos.find(r => (getCampo(r.campoId) || {}).id === 'f_lado')
           || t.campos.find(r => /lado|ubicaci/i.test((getCampo(r.campoId) || {}).etiqueta || ''));
  if(!ref) return 0;
  const v = String(e.valores[ref.campoId] || '').toLowerCase();
  if(/derech|abajo|infer|\bpar\b/.test(v)) return 1;
  if(/izquierd|arriba|super|impar/.test(v)) return -1;
  return 0;
}
/* texto para el tooltip del esquema: código + SOLO el valor de los campos marcados con "Esquema" */
function hoverEsq(e){
  const t = getTipo(e.tipoId); if(!t) return '';
  const parts = [];
  t.campos.forEach(r => { if(!r.hover) return; const c = getCampo(r.campoId); if(!c) return;
    const v = e.valores[r.campoId]; if(v != null && String(v).trim() !== '') parts.push(String(v)); });
  if(!parts.length) return '';
  return (e.codigo ? e.codigo + '\n' : '') + parts.join('\n');
}
/* cruce bajo vía / paso de vía: el elemento pasa de un lado al otro (se dibuja atravesando la vía).
   Se activa si "Tipo de canalización" o "Lado / ubicación" contienen "cruce bajo vía" o "paso de vía". */
function esCruce(e){
  const t = getTipo(e.tipoId); if(!t) return false;
  return t.campos.some(r => {
    const c = getCampo(r.campoId); if(!c || (c.id !== 'f_tcanal' && c.id !== 'f_lado')) return false;
    return /cruce\s*bajo\s*v[ií]a|paso\s*de\s*v[ií]a/i.test(String(e.valores[r.campoId] || ''));
  });
}
/* lugar (estación/tramo con nombre) al que pertenece un elemento, por solape de PK */
function lugarDe(e){
  const lugares = (proyActivo() || {}).lugares || []; if(!lugares.length) return null;
  const p = elemPK(e);
  const a = !isNaN(p.ini) ? p.ini : (!isNaN(p.pu) ? p.pu : NaN);
  const b = !isNaN(p.fin) ? p.fin : (!isNaN(p.pu) ? p.pu : NaN);
  if(isNaN(a) && isNaN(b)) return null;
  const lo = isNaN(a) ? b : a, hi = isNaN(b) ? a : b;
  return lugares.find(l => hi >= l.pkIni && lo <= l.pkFin) || null;
}
function valorEstado(e){
  const t = getTipo(e.tipoId); if(!t) return '';
  const ref = t.campos.find(r => { const c = getCampo(r.campoId); return c && c.etiqueta.toLowerCase().includes('estado'); });
  return ref ? (e.valores[ref.campoId] || '') : '';
}
function valorPK(e){
  const t = getTipo(e.tipoId); if(!t) return '';
  const ref = t.campos.find(r => { const c = getCampo(r.campoId); return c && c.tipo === 'pk'; });
  return ref ? (e.valores[ref.campoId] || '') : '';
}
function valorPorEtiqueta(e, etq){
  const t = getTipo(e.tipoId); if(!t) return '';
  const ref = t.campos.find(r => { const c = getCampo(r.campoId); return c && c.etiqueta === etq; });
  return ref ? (e.valores[ref.campoId] || '') : '';
}
/* ---- campos condicionales (dependencias entre campos de un tipo) ---- */
function condCumple(cond, valores){
  const v = (valores[cond.campoId] == null ? '' : String(valores[cond.campoId])).trim();
  switch(cond.op){
    case 'relleno': return !!v;
    case 'vacio':   return !v;
    case 'noEs':    return v !== String(cond.valor);
    case 'unoDe':   return Array.isArray(cond.valor) && cond.valor.map(String).includes(v);
    case 'mayor':   return parseFloat(v.replace(',', '.')) >  parseFloat(cond.valor);
    case 'menor':   return parseFloat(v.replace(',', '.')) <  parseFloat(cond.valor);
    case 'es':
    default:        return v === String(cond.valor);
  }
}
function campoVisible(tipo, ref, valores){
  const r = ref && ref.regla;
  if(!r || !Array.isArray(r.conds) || !r.conds.length) return true;
  const conds = r.conds.filter(c => c && c.campoId && tipo.campos.some(x => x.campoId === c.campoId));
  if(!conds.length) return true;
  const res = conds.map(c => condCumple(c, valores));
  return r.juntar === 'O' ? res.some(Boolean) : res.every(Boolean);
}
function reglaTexto(ref){
  const r = ref && ref.regla; if(!r || !Array.isArray(r.conds) || !r.conds.length) return '';
  const parte = c => {
    const et = (getCampo(c.campoId) || {}).etiqueta || '¿?';
    if(c.op === 'relleno') return et + ' tiene valor';
    if(c.op === 'vacio')   return et + ' está vacío';
    if(c.op === 'unoDe')   return et + ' ∈ {' + (Array.isArray(c.valor) ? c.valor.join(', ') : '') + '}';
    return et + ' ' + ({es:'=', noEs:'≠', mayor:'>', menor:'<'}[c.op] || '=') + ' ' + c.valor;
  };
  return 'Solo si ' + r.conds.map(parte).join(r.juntar === 'O' ? '  ó  ' : '  y  ');
}
function estadoProyecto(pid){
  const es = state.elementos.filter(e => e.proyectoId === pid);
  if(!es.length) return {txt:'Sin datos', cls:'gray'};
  const inc = es.filter(e => /incidenc/i.test(valorEstado(e))).length;
  if(inc) return {txt: inc + (inc > 1 ? ' incidencias' : ' incidencia'), cls:'red'};
  if(es.every(e => /verific/i.test(valorEstado(e)))) return {txt:'Completado', cls:'green'};
  return {txt:'En obra', cls:'amber'};
}
const colorEstado = cls => ({gray:'#3a4a58', green:'#33c07d', amber:'#e0a13c', red:'#e23744'}[cls] || '#3a4a58');
function kmDeElementos(es){
  return es.reduce((a, e) => { const p = elemPK(e); return a + ((!isNaN(p.ini) && !isNaN(p.fin)) ? Math.abs(p.fin - p.ini) : 0); }, 0);
}
const ESTADOS_M = ['Pendiente', 'En ejecución', 'Instalado', 'Verificado', 'Con incidencia'];
const CERTS = ['Sin certificar', 'Acopiado', 'Certificado'];
function tipoEsLineal(t){ return !!(t && t.campos.some(r => (getCampo(r.campoId) || {}).etiqueta === 'PK inicio') && t.campos.some(r => (getCampo(r.campoId) || {}).etiqueta === 'PK fin')); }
function metrosDe(e){ const p = elemPK(e); return (!isNaN(p.ini) && !isNaN(p.fin)) ? Math.round(Math.abs(p.fin - p.ini) * 1000) : 0; }
function certDe(e){ const t = getTipo(e.tipoId); if(!t) return ''; const r = t.campos.find(rr => rr.campoId === 'f_cert'); return r ? (e.valores.f_cert || 'Sin certificar') : ''; }
function acopioDe(e){ return e.valores.f_nacopio || ''; }
function fmtMed(t, val){ return tipoEsLineal(t) ? (val.toLocaleString('es-ES') + ' m') : String(val); }
/* devuelve, por tipoId presente en `els`: {tipo, lineal, total, porEstado:{estado:valor}} */
function desglose(els){
  const out = [];
  [...new Set(els.map(e => e.tipoId))].forEach(tid => {
    const t = getTipo(tid); if(!t) return;
    const lin = tipoEsLineal(t);
    const grp = els.filter(e => e.tipoId === tid);
    const porEstado = {};
    ESTADOS_M.forEach(s => porEstado[s] = 0);
    let sinEstado = 0, total = 0;
    grp.forEach(e => {
      const v = lin ? metrosDe(e) : 1;
      total += v;
      const est = valorEstado(e);
      const key = ESTADOS_M.find(s => est.toLowerCase().includes(s.toLowerCase().slice(0, 6)));
      if(key) porEstado[key] += v; else sinEstado += v;
    });
    out.push({t, lin, total, porEstado, sinEstado, n:grp.length});
  });
  return out.sort((a, b) => a.t.nombre.localeCompare(b.t.nombre, 'es'));
}

function medidaDe(e){
  const t = getTipo(e.tipoId), lin = tipoEsLineal(t);
  let total = +e.valores.f_cant;
  if(!(total > 0)) total = lin ? metrosDe(e) : 1;
  let cert = +e.valores.f_certcant;
  if(!(cert >= 0) || isNaN(cert)) cert = (certDe(e) === 'Certificado') ? total : 0;
  cert = Math.min(cert, total);
  return {total, cert, unidad: lin ? 'm' : 'ud', lin};
}

function abrirPdf(file){
  destinoProyectoModal(file.name, pid => {
    state.proyectoActivo = pid;
    const pr = proyActivo(); if(pr) pr.pdf = file.name;
    save();
    pdfName = file.name; analisis = null;
    const r = new FileReader();
    r.onload = () => pdfjsLib.getDocument({data:r.result}).promise
      .then(doc => { pdfDoc = doc; pdfPage = 1; pdfCache[pid] = {doc, name:file.name}; currentView = 'plano'; render(); })
      .catch(err => alert('No se pudo leer el PDF: ' + err.message));
    r.readAsArrayBuffer(file);
  });
}
function cargarPdfActivo(){
  const inp = el('input', {type:'file', accept:'.pdf,application/pdf'});

function renderPdf(){
  if(!pdfDoc) return;
  const canvas = document.getElementById('pdfCanvas'); if(!canvas) return;
  pdfDoc.getPage(pdfPage).then(page => {
    const vp = page.getViewport({scale:pdfScale});

    page.render({canvasContext:ctx, viewport:vp});
  });

/* ================= análisis del PDF ================= */
let analisis = null;
const isPK = s => /^\d{1,3}[.,]\d{3}$/.test(String(s).replace(/^k?m\.?\s*/i, '').trim());
const normNombre = s => String(s).trim().replace(/[´'’‘`]/g, "'").replace(/\s+/g, ' ');
const esCabecera = s => /^(nombre|n[ºo°]|p\.?\s?k\.?|modelo|vel\.?|se[ñn]al|distancia|v[ií]a|total|util|km|long)/i.test(String(s).trim());

async function extraerTokens(){
  const out = [];
  for(let p = 1; p <= pdfDoc.numPages; p++){
    const page = await pdfDoc.getPage(p);
    const vp = page.getViewport({scale:1});
    const tc = await page.getTextContent();
    tc.items.forEach(it => {
      const s = (it.str || '').trim();
      if(!s) return;
      const m = pdfjsLib.Util.transform(vp.transform, it.transform);
      out.push({str:s, x:m[4], y:m[5], w:(it.width || 0), page:p});
    });
  }
  return out;
}
async function analizarPdf(){
  if(!pdfDoc) return;
  let tokens;
  try{ tokens = await extraerTokens(); }
  catch(err){ alert('No se pudo extraer texto: ' + err.message); return; }
  if(!tokens.length){ alert('El PDF no tiene texto seleccionable (parece un escaneo). Haría falta OCR.'); return; }

  const byKey = {};
  const add = (codigo, tipoId, pk, origen, pos, extra) => {
    codigo = normNombre(codigo); if(!codigo || esCabecera(codigo)) return;
    const key = tipoId + '|' + codigo.toUpperCase();
    if(byKey[key]){
      const c = byKey[key];
      if(!c.pk && pk) c.pk = pk;
      if(!c.pos && pos) c.pos = pos;
      if(extra) c.extra = Object.assign(c.extra || {}, extra);
      if(origen && c.origen.indexOf(origen) < 0) c.origen += ' + ' + origen;
    } else byKey[key] = {codigo, tipoId, pk:pk || '', origen:origen || '', pos:pos || null, extra:extra || null, importar:true};
  };
  const pkCerca = tok => {
    let best = '', bd = 1e9;
    tokens.forEach(o => {
      if(o.page !== tok.page || !isPK(o.str)) return;
      const dy = Math.abs(o.y - tok.y), dx = o.x - tok.x;
      if(dy < 9 && dx > -40 && dx < 280 && dx < bd){ bd = dx; best = o.str.replace(/^k?m\.?\s*/i, '').trim(); }
    });
    return best;
  };
  const vecinoDcha = tok => tokens.find(o => o !== tok && o.page === tok.page && Math.abs(o.y - tok.y) < 5
    && (o.x - (tok.x + (tok.w || 8))) > -4 && (o.x - (tok.x + (tok.w || 8))) < 26);
  (state.patrones || []).filter(p => p.regex).forEach(p => {
    let re; try{ re = new RegExp(p.regex); }catch(e){ return; }
    tokens.forEach(tok => {
      const nx = vecinoDcha(tok);
      const cands = [tok.str.trim()];
      if(nx){ cands.push((tok.str + nx.str).trim()); cands.push((tok.str.trim() + ' ' + nx.str.trim())); }
      for(const cs of cands){
        if(re.test(normNombre(cs))){ add(cs.replace(/\s+/g, ' ').trim(), p.tipoId, pkCerca(tok), 'esquema', {page:tok.page, x:tok.x, y:tok.y}); break; }
      }
    });
  });
  /* "CV" + token contiguo → circuito de vía (por si vienen partidos) */
  const pCv = (state.patrones || []).find(p => p.tipoId === 't_cdv') || {tipoId:'t_cdv'};
  tokens.forEach(tok => {
    if(!/^CV$/i.test(tok.str.trim())) return;
    let sig = null, bd = 1e9;
    tokens.forEach(o => {
      if(o === tok || o.page !== tok.page) return;
      const dy = Math.abs(o.y - tok.y), dx = o.x - (tok.x + (tok.w || 12));
      if(dy < 6 && dx > -4 && dx < 42 && dx < bd && /^[A-ZÑ'’]{1,3}\d{0,3}$|^\d{1,3}$/.test(o.str.trim())){ bd = dx; sig = o; }
    });
    if(sig) add('CV ' + sig.str.trim(), pCv.tipoId, pkCerca(tok) || pkCerca(sig), 'esquema', {page:tok.page, x:tok.x, y:tok.y});
  });
  (state.patrones || []).filter(p => p.tabla).forEach(p => {
    try{
      const filas = extraerTabla(tokens, p.tabla.toUpperCase());
      const T = p.tabla.toUpperCase();
      filas.forEach(row => {
        const cel = row.map(t => t.str.trim());
        if(row.every(t => esCabecera(t.str))) return;
        if(T.indexOf('BALIZA') > -1){
          const esSen = x => /^I?[ESR]['´’]?\d{1,2}(?:\/\d{1,2})?$/.test(x);
          for(let i = 0; i < row.length; i++){
            if(esSen(cel[i])){
              let j = i + 1; const partes = [];
              while(j < row.length && !esSen(cel[j])){ partes.push(cel[j]); j++; }
              add('BAL ' + cel[i], p.tipoId, '', 'tabla BALIZAS', null, {f_senasoc:cel[i], f_distsen:partes.join(' ')});
            }
          }
        } else if(T.indexOf('APARATO') > -1){
          const nn = cel.find(x => /^(\d{1,3}|TOP\.?\d{1,2}|C\d{1,2}|[A-ZÑ]{1,3}\d{1,3})$/i.test(x) && !isPK(x));
          const pk = cel.find(isPK);
          if(nn) add(/^\d{1,3}$/.test(nn) ? 'AG-' + nn : nn, p.tipoId, pk || '', 'tabla APARATOS', null, null);
        } else if(T.indexOf('PIQUETE') > -1){
          const n = cel.find(x => /^\d{1,3}$/.test(x));
          const pk = cel.find(isPK);
          if(n) add('PIQ-' + n, p.tipoId, pk || '', 'tabla PIQUETES', null, null);
        } else {
          const codigoLike = x => /[A-Za-zÑñ].*\d|\d\s*\/\s*\d/.test(x) && !isPK(x);
          for(let i = 0; i < row.length; i++){
            if(isPK(cel[i]) && i > 0 && codigoLike(cel[i - 1]) && !esCabecera(cel[i - 1]))
              add(cel[i - 1], p.tipoId, cel[i], 'tabla ' + p.tabla, null, null);
          }
        }
      });
    }catch(e){ /* tabla no encontrada */ }
  });
  Object.values(byKey).forEach(c => {
    if(c.pk || !c.extra || !c.extra.f_senasoc) return;
    const s = byKey['t_senal|' + normNombre(c.extra.f_senasoc).toUpperCase()];
    if(s && s.pk) c.pk = s.pk;
  });

  /* --- posibles no clasificados: códigos del esquema junto a un PK, sin capturar --- */
  const yaCodigos = new Set(Object.values(byKey).map(c => c.codigo.toUpperCase()));
  const tipoDef = (state.elementTypes[0] || {}).id;
  const codeShape = s => /^[A-ZÑ][A-ZÑ0-9'’.\/-]{0,9}$/i.test(s) && /[A-ZÑ]/i.test(s) && /[0-9]/.test(s) && !isPK(s);
  tokens.forEach(tok => {
    const s = normNombre(tok.str);
    if(!codeShape(s) || esCabecera(s) || yaCodigos.has(s.toUpperCase())) return;
    const pk = pkCerca(tok); if(!pk) return;                    /* solo si hay un PK al lado */
    const key = tipoDef + '|' + s.toUpperCase();
    if(byKey[key]) return;
    byKey[key] = {codigo:s, tipoId:tipoDef, pk, origen:'sin clasificar', pos:{page:tok.page, x:tok.x, y:tok.y}, extra:null, importar:false};
    yaCodigos.add(s.toUpperCase());
  });

  /* deducir la vía de los candidatos que tienen posición en el esquema */
  const porPag = {};
  Object.values(byKey).forEach(cn => {
    if(cn.via || !cn.pos) return;
    if(!porPag[cn.pos.page]) porPag[cn.pos.page] = tokens.filter(t => t.page === cn.pos.page).map(t => ({s:t.str, x:t.x, y:t.y}));
    cn.via = viaDeTexto(porPag[cn.pos.page], cn.pos.x, cn.pos.y);
  });

  const candidatos = Object.values(byKey).sort((a, b) =>
    a.tipoId === b.tipoId ? a.codigo.localeCompare(b.codigo, 'es', {numeric:true}) : a.tipoId.localeCompare(b.tipoId));
  analisis = {tokens, candidatos};
  render();
}
function extraerTabla(tokens, heading){
  /* todas las apariciones del encabezado (una por estación / hoja) */
  const heads = tokens.filter(t => t.str.toUpperCase().replace(/\s+/g, ' ').indexOf(heading) > -1);
  if(!heads.length) return [];
  let out = [];
  heads.forEach(h => { out = out.concat(extraerUnaTabla(tokens, h)); });
  return out;
}
function extraerUnaTabla(tokens, h){
  const abajo = tokens.filter(t => t.page === h.page && t.y > h.y + 2 && t.y < h.y + 420).sort((a, b) => a.y - b.y || a.x - b.x);
  const agrupa = arr => {
    const rows = []; let cur = [];
    arr.forEach(t => { if(cur.length && Math.abs(t.y - cur[cur.length - 1].y) > 6){ rows.push(cur); cur = []; } cur.push(t); });
    if(cur.length) rows.push(cur);
    return rows.map(r => r.slice().sort((a, b) => a.x - b.x));
  };
  const hc = h.x + (h.w || h.str.length * 4) / 2;
  const enFranja = agrupa(abajo).map(r => r.filter(t => Math.abs((t.x + (t.w || 20) / 2) - hc) < 360)).filter(r => r.length);
  let hi = enFranja.findIndex(r => r.filter(t => esCabecera(t.str)).length >= 2);
  if(hi < 0) hi = 0;
  const y0 = enFranja[hi][enFranja[hi].length - 1].y;
  const res = []; let prevY = y0;
  for(let i = hi + 1; i < enFranja.length; i++){
    const r = enFranja[i];
    if(r[0].y - prevY > 34) break;
    if(r[0].y - y0 > 260) break;
    if(r.length === 1 && /[A-ZÑ]{4,}.*[-(]/.test(r[0].str)) break;
    res.push(r); prevY = r[0].y;
  }
  return res;
}

function viasConocidas(){
  const s = new Set();
  (proyActivo().vias || []).forEach(v => { if(v.num != null && v.num !== '') s.add(String(v.num)); });
  elementosProy().forEach(e => {
    const v = String(viaDe(e) || '').trim();
    if(v && v !== '—' && !/^1(\D|$)/.test(v)) s.add(v);
  });
  return [...s].sort((a, b) => String(a).localeCompare(String(b), 'es', {numeric:true}));
}
/* vías que el programa dibuja a partir del campo Vía de los elementos (no están en proyecto.vias) */
function viasDetectadas(){
  const dibujadas = new Set((proyActivo().vias || []).map(v => String(v.num)));
  const m = new Map();
  elementosProy().forEach(e => {
    const v = String(viaDe(e) || '').trim();
    if(!v || v === '—' || /^1(\D|$)/.test(v) || dibujadas.has(v)) return;
    m.set(v, (m.get(v) || 0) + 1);
  });
  return [...m.entries()].map(([num, n]) => ({num, n})).sort((a, b) => String(a.num).localeCompare(String(b.num), 'es', {numeric:true}));
}
/* convierte una vía detectada en vía editable de proyecto.vias (PKs desde los elementos) */
function materializarVia(num){
  const pr = proyActivo(); pr.vias = pr.vias || [];
  const ya = pr.vias.find(v => String(v.num) === String(num));
  if(ya) return ya;
  const pks = [];
  elementosProy().forEach(e => {
    if(String(viaDe(e) || '').trim() !== String(num)) return;
    const p = elemPK(e); [p.ini, p.fin, p.pu].forEach(k => { if(!isNaN(k)) pks.push(k); });
  });
  pks.sort((a, b) => a - b);
  const a = pks.length ? pks[0] : mnPKProy(), b = pks.length ? pks[pks.length - 1] : a + 0.3;
  const sp = Math.max((b - a) * 0.15, 0.03);
  const rec = {id:uid(), num:String(num), padre:'1', lugar:'general', tipo:'secundaria', pkIni:a - sp, pkFin:b + sp};
  pr.vias.push(rec); registrarCambio('vía', 'vía ' + num + ' detectada → editable'); save();
  return rec;
}
function mnPKProy(){ const p = []; elementosProy().forEach(e => { const q = elemPK(e); [q.ini, q.fin, q.pu].forEach(k => { if(!isNaN(k)) p.push(k); }); }); return p.length ? Math.min(...p) : 0; }
/* borra el valor del campo Vía = num en los elementos que lo tengan (con snapshot en histórico) */
function quitarViaDeElementos(num){
  let n = 0;
  state.elementos.forEach(e => {
    if(e.proyectoId !== state.proyectoActivo || e.borrado) return;
    const t = getTipo(e.tipoId); if(!t) return;
    const vr = viaRefDe(t); if(!vr) return;
    if(String(e.valores[vr] || '').trim() !== String(num)) return;
    e.hist = e.hist || [];
    e.hist.push({ts:Date.now(), snap:{codigo:e.codigo, valores:clone(e.valores), plano:e.plano ? clone(e.plano) : null}});
    if(e.hist.length > 40) e.hist.shift();
    e.valores[vr] = ''; e.modificado = Date.now(); n++;
  });
  if(n){ registrarCambio('vía', 'vía ' + num + ' quitada de ' + n + ' elemento(s)'); save(); }
  return n;
}

/* ---- extracción de trazos vectoriales de una página (para calibrar/detectar símbolos) ---- */
async function extraerSubpaths(page){
  const ol = await page.getOperatorList(), O = pdfjsLib.OPS;
  let ctm = [1,0,0,1,0,0]; const st = []; let cur = [], cv = 0, seg = 0;
  const out = [];
  const M = (m,n)=>[m[0]*n[0]+m[2]*n[1],m[1]*n[0]+m[3]*n[1],m[0]*n[2]+m[2]*n[3],m[1]*n[2]+m[3]*n[3],m[0]*n[4]+m[2]*n[5]+m[4],m[1]*n[4]+m[3]*n[5]+m[5]];
  const ap = (m,x,y)=>[m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]];
  const flush = () => {
    if(cur.length >= 2){
      let a=1e9,b=1e9,c=-1e9,d=-1e9;
      for(const p of cur){ if(p[0]<a)a=p[0]; if(p[0]>c)c=p[0]; if(p[1]<b)b=p[1]; if(p[1]>d)d=p[1]; }
      out.push({x:(a+c)/2, y:(b+d)/2, w:c-a, h:d-b, cv, seg});
    }
    cur = []; cv = 0; seg = 0;
  };
  const add = (x,y)=>cur.push(ap(ctm, x, y));
  const path = (sub, co) => { let k = 0; for(const sf of sub){
    if(sf===O.moveTo){ flush(); add(co[k],co[k+1]); k+=2; }
    else if(sf===O.lineTo){ add(co[k],co[k+1]); k+=2; seg++; }
    else if(sf===O.curveTo){ add(co[k],co[k+1]); add(co[k+2],co[k+3]); add(co[k+4],co[k+5]); k+=6; cv++; seg++; }
    else if(sf===O.curveTo2){ add(co[k],co[k+1]); add(co[k+2],co[k+3]); k+=4; cv++; seg++; }
    else if(sf===O.curveTo3){ add(co[k],co[k+1]); add(co[k+2],co[k+3]); k+=4; cv++; seg++; }
    else if(sf===O.rectangle){ flush(); const x=co[k],y=co[k+1],w=co[k+2],h=co[k+3]; k+=4; add(x,y);add(x+w,y);add(x+w,y+h);add(x,y+h);add(x,y); seg+=4; }
  } };
  for(let i = 0; i < ol.fnArray.length; i++){
    const fn = ol.fnArray[i], a = ol.argsArray[i];
    if(fn===O.save) st.push(ctm.slice());
    else if(fn===O.restore) ctm = st.pop() || [1,0,0,1,0,0];
    else if(fn===O.transform) ctm = M(ctm, a);
    else if(fn===O.constructPath) path(a[0], a[1]);
    else if(fn===O.moveTo){ flush(); add(a[0],a[1]); }
    else if(fn===O.lineTo){ add(a[0],a[1]); seg++; }
    else if(fn===O.curveTo){ add(a[0],a[1]); add(a[2],a[3]); add(a[4],a[5]); cv++; seg++; }
    else if(fn===O.rectangle){ flush(); add(a[0],a[1]); add(a[0]+a[2],a[1]); add(a[0]+a[2],a[1]+a[3]); add(a[0],a[1]+a[3]); add(a[0],a[1]); seg+=4; }
    else if(fn===O.fill||fn===O.eoFill||fn===O.stroke||fn===O.fillStroke||fn===O.eoFillStroke||fn===O.endPath) flush();
  }
  flush();
  return out;
}
const pkRefDe = t => { const r = t.campos.find(rr => { const c = getCampo(rr.campoId); return c && c.tipo === 'pk'; }); return r ? r.campoId : null; };
const viaRefDe = t => { const r = t.campos.find(rr => { const c = getCampo(rr.campoId); return c && /v[ií]a/i.test(c.etiqueta); }); return r ? r.campoId : null; };
/* deduce el nº de vía a partir de las etiquetas "VIA N" del plano más cercanas a (x,y) */
function viaDeTexto(txt, x, y, maxD){
  const cands = [];
  txt.forEach(t => {
    const s = String(t.s).trim();
    const m = s.match(/^v[ií]a\s*(\d{1,2})$/i);
    if(m){ cands.push({v:m[1], x:t.x, y:t.y}); return; }
    if(/^v[ií]a$/i.test(s)){
      const nx = txt.find(o => o !== t && Math.abs(o.y - t.y) < 8 && o.x > t.x && o.x - t.x < 45 && /^\d{1,2}$/.test(String(o.s).trim()));
      if(nx) cands.push({v:String(nx.s).trim(), x:t.x, y:t.y});
    }
  });
  let best = '', bd = maxD || 240;
  cands.forEach(cc => { const d = Math.hypot(cc.x - x, cc.y - y); if(d < bd){ bd = d; best = cc.v; } });
  return best;
}
function calibrar(page){
  const pts = [];
  elementosProy().forEach(e => {
    if(!e.plano || e.plano.page !== page || e.plano.x == null) return;
    const k = firstPk(e); if(isNaN(k)) return;
    pts.push({pk:k, x:e.plano.x});
  });
  if(pts.length < 2) return null;
  const ks = pts.map(p => p.pk);
  if(Math.max(...ks) - Math.min(...ks) < 1e-4) return null;
  const n = pts.length; let sx = 0, sy = 0, sxy = 0, sxx = 0;
  pts.forEach(o => { sx += o.pk; sy += o.x; sxy += o.pk * o.x; sxx += o.pk * o.pk; });
  const den = n * sxx - sx * sx; if(Math.abs(den) < 1e-9) return null;
  const m = (n * sxy - sx * sy) / den, c = (sy - m * sx) / n;
  if(!isFinite(m) || Math.abs(m) < 1e-9) return null;
  return {appl:pk => m * pk + c, inv:x => (x - c) / m, n};
}
function posPlano(e, cal, page, defY){
  const p = elemPK(e);
  let y = (e.plano && e.plano.page === page && e.plano.y != null) ? e.plano.y : null;
  let xi = null, xf = null;
  if(cal){
    if(!isNaN(p.ini) && !isNaN(p.fin)){ xi = cal.appl(Math.min(p.ini, p.fin)); xf = cal.appl(Math.max(p.ini, p.fin)); }
    else { const k = firstPk(e); if(!isNaN(k)) xi = cal.appl(k); }
  }
  if(xi == null && e.plano && e.plano.x != null){ xi = e.plano.x; if(e.plano.x2 != null) xf = e.plano.x2; }
  if(xi == null) return null;
  if(y == null) y = defY;
  return {x:xi, x2:(xf != null && Math.abs(xf - xi) > 2) ? xf : null, y};
}

  tb3.appendChild(el('span', {class:'spacer'}));
  tb3.appendChild(el('span', {style:'color:var(--tx3);font-size:12px'}, 'Calibra un ejemplo de cada símbolo y "Detectar" busca las copias'));
  cont.appendChild(tb3);
  if(esqCalib) cont.appendChild(el('p', {class:'hint', style:'color:var(--amb)'}, 'Haz clic justo encima de un símbolo (semáforo, aguja, baliza…) para capturar su firma.'));

  const cal = calibrar(esqPage);
  cont.appendChild(el('p', {class:'hint'}, cal
    ? 'PK calibrado con ' + cal.n + ' puntos: al cambiar el PK de un elemento se recoloca en el plano.'
    : 'Aún no se puede calibrar el PK (hacen falta 2+ elementos con posición y PK). Coloca elementos con "Modo añadir" o desde los chips de abajo.'));
  if(esqAdd.on) cont.appendChild(el('p', {class:'hint', style:'color:var(--amb)'}, 'Haz clic sobre el plano para añadir un elemento en ese punto.'));

  holder.appendChild(el('div', {id:'esqLayer'}));
  holder.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = holder.getBoundingClientRect();
    const fx = (holder.scrollLeft + ev.clientX - r.left) / Math.max(1, holder.scrollWidth);
    const fy = (holder.scrollTop + ev.clientY - r.top) / Math.max(1, holder.scrollHeight);
    esqPdfScale = Math.max(0.3, Math.min(12, (esqPdfScale || 1) * (ev.deltaY < 0 ? 1.2 : 1 / 1.2)));
    esqWheelPend = {fx, fy, pdf:true};
    reRenderLento();
  }, {passive:false});
  cont.appendChild(holder);

  const sinUb = els.filter(e => !(e.plano && e.plano.x != null) && isNaN(firstPk(e)));
  const trasCal = els.filter(e => !posPlano(e, cal, esqPage, 0));

  if(tray.length){

    ch.appendChild(el('span', {style:'color:var(--tx3);font-size:12px'}, 'Sin ubicar (clic y luego clic en el plano):'));
    tray.forEach(e => ch.appendChild(el('span', {class:'chip' + (esqColocar === e.id ? ' sel' : ''),
      onclick:() => { esqColocar = e.id; esqAdd.on = false; render(); }}, e.codigo || getTipo(e.tipoId).nombre)));
    cont.appendChild(ch);
  }

  setTimeout(() => renderEsqPdf(pack), 0);
  return cont;
}

async function renderEsqPdf(pack){
  const canvas = document.getElementById('esqPdf'); if(!canvas) return;
  const holder = canvas.parentElement;
  let page;
  try{ page = await pack.doc.getPage(esqPage); }catch(e){ return; }
  const base = page.getViewport({scale:1});
  const fit = Math.max(0.3, Math.min(3, (holder.clientWidth - 6) / base.width));
  const S = esqPdfScale ? fit * esqPdfScale : fit;
  const vp = page.getViewport({scale:S});
  canvas.width = vp.width; canvas.height = vp.height;
  try{ await page.render({canvasContext:canvas.getContext('2d'), viewport:vp}).promise; }catch(e){ return; }
  if(esqWheelPend && esqWheelPend.pdf){
    const wp = esqWheelPend; esqWheelPend = null;
    requestAnimationFrame(() => {
      const r = holder.getBoundingClientRect();
      holder.scrollLeft = wp.fx * holder.scrollWidth - (holder.clientWidth / 2);
      holder.scrollTop = wp.fy * holder.scrollHeight - (holder.clientHeight / 2);
    });
  }
  const layer = document.getElementById('esqLayer'); if(!layer) return;
  layer.style.width = vp.width + 'px'; layer.style.height = vp.height + 'px';
  layer.style.cursor = (esqAdd.on || esqColocar || esqCalib) ? 'crosshair' : 'default';
  layer.innerHTML = '';
  layer.dataset.s = S; layer.dataset.h = base.height;
  if(esqSubPage !== esqPage){ esqSubpaths = null; esqSubPage = esqPage;
    extraerSubpaths(page).then(sp => { esqSubpaths = sp; }).catch(() => {}); }
  const cal = calibrar(esqPage);
  const defY = base.height * 0.5;
  const puntos = [], lineales = [];
  elementosProy().forEach(e => {
    if(!pasaFiltros(e)) return;
    const pos = posPlano(e, cal, esqPage, defY); if(!pos) return;
    (pos.x2 != null ? lineales : puntos).push({e, pos});
  });
  /* apila los lineales que se solapan en filas separadas para que no se pisen */
  lineales.sort((a, b) => a.pos.x - b.pos.x);
  const filasL = [];
  lineales.forEach(o => {
    let fi = filasL.findIndex(f => f.max < o.pos.x - 3 / S);
    if(fi < 0){ fi = filasL.length; filasL.push({max:-1e9}); }
    filasL[fi].max = Math.max(o.pos.x, o.pos.x2);
    o.fila = fi;
  });
  const rowH = 7;
  lineales.forEach(({e, pos, fila}) => {
    const t = getTipo(e.tipoId) || {};
    const y = pos.y * S + fila * rowH;
    layer.appendChild(el('div', {class:'mk-bar', 'data-el':e.id, title:e.codigo || '',
      style:'left:' + (pos.x * S) + 'px;top:' + y + 'px;width:' + Math.max(4, (pos.x2 - pos.x) * S) + 'px;background:' + (t.color || '#888')}));
    layer.appendChild(el('div', {class:'mk-lbl', style:'left:' + (pos.x * S) + 'px;top:' + (y - 12) + 'px'}, e.codigo || ''));
  });
  puntos.forEach(({e, pos}) => {
    const t = getTipo(e.tipoId) || {};
    layer.appendChild(el('div', {class:'mk', 'data-el':e.id, title:(e.codigo || '') + ' · ' + (t.nombre || ''),
      style:'left:' + (pos.x * S) + 'px;top:' + (pos.y * S) + 'px;background:' + (t.color || '#888')}));
    layer.appendChild(el('div', {class:'mk-lbl', style:'left:' + (pos.x * S) + 'px;top:' + (pos.y * S - 13) + 'px'}, e.codigo || ''));
  });
  layer.onclick = ev => {
    const m = ev.target.closest('[data-el]');
    if(m){ nuevoElemento(m.getAttribute('data-el')); return; }
    const rect = layer.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / S, py = (ev.clientY - rect.top) / S;
    if(esqCalib){
      if(!esqSubpaths){ alert('Aún se está leyendo el dibujo de la hoja, espera un momento y reinténtalo.'); return; }
      capturarFirma(px, base.height - py);   /* a espacio PDF (y hacia arriba) */
      return;
    }
    if(esqColocar){
      if(soloLectura()){ esqColocar = null; render(); return; }
      const e = state.elementos.find(x => x.id === esqColocar);
      if(e){
        e.hist = e.hist || [];
        e.hist.push({ts:Date.now(), snap:{codigo:e.codigo, valores:clone(e.valores), plano:e.plano ? clone(e.plano) : null}});
        if(e.hist.length > 40) e.hist.shift();
        e.plano = {page:esqPage, x:px, y:py};
        const ref = pkRefDe(getTipo(e.tipoId));
        if(ref && cal && isNaN(firstPk(e))) e.valores[ref] = toPkStr(cal.inv(px));
        e.modificado = Date.now();
        registrarCambio('edición', (e.codigo || getTipo(e.tipoId).nombre) + ': situado en el plano', e.id);
        esqColocar = null; save(); render();
      }
      return;
    }
    if(esqAdd.on && esqAdd.tipoId){
      const t = getTipo(esqAdd.tipoId); const pref = {};
      const ref = pkRefDe(t); if(ref && cal) pref[ref] = toPkStr(cal.inv(px));
      nuevoElemento(null, {tipoId:esqAdd.tipoId, valores:pref, plano:{page:esqPage, x:px, y:py}});
    }
  };
}

/* ================= calibración / detección de símbolos ================= */
function trazosCerca(sps, ux, uy, R){
  return sps.filter(p => Math.hypot(p.x - ux, p.y - uy) < R)
    .filter(p => { const M = Math.max(p.w, p.h), m = Math.min(p.w, p.h);
      return M > 0.8 && M < 34 && !(m < 1.3 && M > 12); })   /* fuera líneas largas finas (vía, ménsula) */
    .sort((a, b) => Math.max(b.w, b.h) - Math.max(a.w, a.h));
}
const firmaKey = marca => marca.find(m => m.cv >= 3 && Math.min(m.w, m.h) > 2.2) || marca[0];
function capturarFirma(ux, uy){
  const near = trazosCerca(esqSubpaths, ux, uy, 24).slice(0, 14);
  if(near.length < 2){ alert('No se ha reconocido ningún dibujo en ese punto. Acerca el zoom y haz clic justo sobre el símbolo.'); return; }
  const marca = near.map(p => ({dx:+(p.x - ux).toFixed(2), dy:+(p.y - uy).toFixed(2), w:+p.w.toFixed(2), h:+p.h.toFixed(2), cv:p.cv}));
  const selT = el('select', null, ...state.elementTypes.map(t => el('option', {value:t.id, ...(t.id === 't_senal' ? {selected:'selected'} : {})}, t.nombre)));
  const inNom = el('input', {value:'Señal'});
  const selD = el('select', null, el('option', {value:''}, '—'), el('option', {value:'Alta (una fila)'}, 'Alta (una fila)'), el('option', {value:'Baja (focos 2×2)'}, 'Baja (focos 2×2)'));
  const selF = el('select', null, el('option', {value:''}, '—'), ...['2','3','4','5'].map(n => el('option', {value:n}, n + ' focos')));
  const sinc = () => {
    const t = getTipo(selT.value) || {};
    inNom.value = t.nombre || 'Símbolo';
    const esSen = /se[ñn]al/i.test(t.nombre || '');
    selD.parentElement.style.display = esSen ? '' : 'none';
    selF.parentElement.style.display = esSen ? '' : 'none';
  };
  selT.addEventListener('change', sinc);
  openModal('Símbolo capturado (' + near.length + ' trazos)',
    el('div', null,
      el('p', {class:'hint', style:'margin-top:0'}, 'Etiqueta este símbolo. "Detectar" buscará todas sus copias en el plano.'),
      el('div', {class:'field'}, el('span', {class:'flab'}, 'Crea elementos de tipo'), selT),
      el('div', {class:'field'}, el('span', {class:'flab'}, 'Nombre de la firma'), inNom),
      el('div', {class:'cols2'},
        el('div', {class:'field'}, el('span', {class:'flab'}, 'Disposición'), selD),
        el('div', {class:'field'}, el('span', {class:'flab'}, 'Nº de focos'), selF)
      )
    ),
    () => {
      const val = {};
      if(selD.value) val.f_sdisp = selD.value;
      if(selF.value) val.f_sfocos = selF.value;
      const pr = proyActivo(); pr.firmas = pr.firmas || [];
      pr.firmas.push({id:uid(), nombre:inNom.value.trim() || 'Símbolo', tipoId:selT.value, valores:val, marca});
      esqCalib = false; save(); render();
    });
  setTimeout(sinc, 0);
}

async function detectarSimbolos(todas){
  const pr = proyActivo(); const firmas = pr.firmas || [];
  const pack = pdfCache[state.proyectoActivo];
  if(!firmas.length || !pack){ return; }
  const paginas = todas ? Array.from({length:pack.doc.numPages}, (_, i) => i + 1) : [esqPage];
  const hits = [];
  try{
    for(const np of paginas){
      const page = await pack.doc.getPage(np);
      const sps = await extraerSubpaths(page);
      const H = page.view[3];
      const tc = await page.getTextContent();
      const txt = tc.items.filter(i => i.str && i.str.trim()).map(i => ({s:i.str.trim(), x:i.transform[4], y:i.transform[5]}));
      firmas.forEach(fi => {
        const key = firmaKey(fi.marca), tolW = Math.max(1.4, key.w * 0.2), tolH = Math.max(1.4, key.h * 0.2);
        sps.forEach(sp => {
          if(Math.abs(sp.w - key.w) > tolW || Math.abs(sp.h - key.h) > tolH || Math.abs(sp.cv - key.cv) > 1) return;
          const ax = sp.x - key.dx, ay = sp.y - key.dy;
          let ok = 0;
          for(const m of fi.marca){
            const tx = ax + m.dx, ty = ay + m.dy, tw = Math.max(1.5, m.w * 0.25), th = Math.max(1.5, m.h * 0.25);
            if(sps.some(o => Math.abs(o.x - tx) < 3 && Math.abs(o.y - ty) < 3 && Math.abs(o.w - m.w) < tw && Math.abs(o.h - m.h) < th)) ok++;
          }
          if(ok >= Math.max(2, Math.ceil(fi.marca.length * 0.6))){
            let lab = '', ld = 1e9, pk = '', pd = 1e9;
            txt.forEach(t => {
              const d = Math.hypot(t.x - ax, t.y - ay);
              if(d < 42 && d < ld && !isPK(t.s)){ ld = d; lab = t.s; }
              if(d < 70 && d < pd && isPK(t.s)){ pd = d; pk = t.s.replace(/^k?m\.?\s*/i, '').trim(); }
            });
            hits.push({page:np, x:ax, y:ay, planoX:ax, planoY:H - ay, firma:fi, tipoId:fi.tipoId, codigo:lab, pk,
              via:viaDeTexto(txt, ax, ay), score:ok, total:fi.marca.length, importar:true});
          }
        });
      });
    }
  }catch(e){ alert('Error leyendo el PDF: ' + e.message); return; }
  hits.sort((a, b) => b.score - a.score);
  const dedup = [];
  hits.forEach(h => { if(!dedup.some(d => d.page === h.page && Math.hypot(d.x - h.x, d.y - h.y) < 9)) dedup.push(h); });
  dedup.sort((a, b) => a.page - b.page || a.planoX - b.planoX);
  detSimb = dedup;
  if(!dedup.length) alert('No se ha encontrado ninguna copia. Prueba a recalibrar con el zoom más cerca, o baja el nº de trazos del símbolo.');
  render();
}
